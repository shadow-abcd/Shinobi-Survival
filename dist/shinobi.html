<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Shinobi Survival — Phase 1</title>
<style>
:root{
  --ink:#0a0810;
  --fire:#ff7a2f;
  --wind:#5fe8c8;
  --hp:#e0405a;
  --chakra:#7c5cff;
  --xp:#3fd0ff;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#06050b;overflow:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#f2eef7;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
#stage{position:fixed;inset:0;overflow:hidden;}
canvas#game{display:block;width:100%;height:100%;background:#06050b;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;transition:opacity .2s;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));}
.hud-top{display:flex;align-items:center;gap:12px;}
.hp{position:relative;flex:1;height:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:4px;overflow:hidden;max-width:340px;}
#hpfill{position:absolute;inset:0;width:100%;background:linear-gradient(90deg,#8c1c33,#e0405a);transition:width .12s linear;}
.hp span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.08em;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000;}
.timer{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.06em;opacity:.92;
  text-shadow:0 0 12px rgba(120,90,255,.5);min-width:64px;text-align:center;}
.chakra{position:relative;flex:1;height:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);
  border-radius:4px;overflow:hidden;max-width:340px;}
#chakrafill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#3b2a86,#7c5cff);transition:width .1s linear;}
#chakrafill.full{background:linear-gradient(90deg,#7c5cff,#b9a6ff);box-shadow:0 0 14px #7c5cff inset;}
.chakra span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;letter-spacing:.08em;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000;}

.hud-bottom{position:absolute;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));
  bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
.xp{position:relative;width:min(520px,52vw);height:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:3px;overflow:hidden;}
#xpfill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#1b6f8a,#3fd0ff);transition:width .12s linear;}
#xptext{position:absolute;right:0;top:-15px;font-size:10.5px;opacity:.8;letter-spacing:.1em;}
.abilities{display:flex;gap:8px;flex-wrap:wrap;}
#hud.min .hud-bottom{opacity:0;}
.ab{position:relative;width:46px;height:46px;border-radius:8px;border:1px solid rgba(255,255,255,.18);
  background:rgba(16,12,24,.72);display:grid;place-items:center;font-size:9px;letter-spacing:.04em;
  text-transform:uppercase;opacity:.55;overflow:hidden;text-align:center;line-height:1.1;padding:2px;}
.ab.on{opacity:1;border-color:rgba(255,255,255,.34);}
.ab .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);height:0%;}
.ab .rk{position:absolute;top:2px;right:3px;font-size:9px;color:#ffd27a;}
.ab .bar{position:absolute;left:0;top:0;bottom:0;width:2px;}
.wave{position:absolute;left:0;right:0;top:26%;text-align:center;font-size:clamp(20px,4vw,40px);
  letter-spacing:.22em;text-transform:uppercase;opacity:0;transition:opacity .4s;text-shadow:0 0 30px rgba(255,120,60,.6);}

/* ---------- Overlays ---------- */
#overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse at center,rgba(10,8,16,.72),rgba(4,3,8,.94));
  backdrop-filter:blur(3px);z-index:10;}
#overlay.hidden{display:none;}
.panel{width:min(920px,94vw);max-height:92vh;overflow:auto;}
.title{font-size:clamp(28px,6vw,54px);letter-spacing:.16em;text-transform:uppercase;font-weight:600;
  background:linear-gradient(180deg,#fff,#ff9a52);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-align:center;margin-bottom:6px;}
.sub{text-align:center;opacity:.66;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:26px;}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:700px){.cards{grid-template-columns:1fr;}}
.card{position:relative;background:linear-gradient(180deg,rgba(30,24,44,.96),rgba(14,11,22,.96));
  border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px 16px 18px;cursor:pointer;
  transition:transform .12s,border-color .12s,box-shadow .12s;}
.card:hover,.card:active{transform:translateY(-3px);border-color:rgba(255,255,255,.4);box-shadow:0 10px 30px rgba(0,0,0,.5);}
.card .k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;margin-bottom:6px;}
.card .n{font-size:18px;margin-bottom:8px;letter-spacing:.03em;}
.card .d{font-size:12.5px;line-height:1.5;opacity:.78;}
.card .tag{display:inline-block;margin-top:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 7px;border-radius:4px;background:rgba(255,255,255,.09);}
.card.fire{border-left:3px solid var(--fire);}
.card.wind{border-left:3px solid var(--wind);}
.card.stat{border-left:3px solid #8a8f9c;}
.card.fusion{border-left:3px solid #ffd27a;}
.center{text-align:center;}
.btn{display:inline-block;margin-top:22px;padding:13px 30px;border-radius:8px;cursor:pointer;
  border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,122,47,.22),rgba(255,122,47,.08));
  letter-spacing:.18em;text-transform:uppercase;font-size:12px;transition:background .15s,transform .1s;}
.btn:hover{background:linear-gradient(180deg,rgba(255,122,47,.4),rgba(255,122,47,.16));transform:translateY(-1px);}
.btn.ghost{background:rgba(255,255,255,.06);}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:22px 0 4px;}
.stat-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px;text-align:center;}
.stat-box .v{font-size:24px;font-variant-numeric:tabular-nums;}
.stat-box .l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.55;margin-top:4px;}
.hint{text-align:center;font-size:12px;opacity:.5;margin-top:18px;letter-spacing:.06em;}
.keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px;font-size:11px;opacity:.62;}
.keys kbd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:4px;padding:3px 7px;font-family:inherit;}

/* ---------- Touch ---------- */
#touch{position:absolute;inset:0;pointer-events:none;z-index:5;}
#touch.hidden{display:none;}
#stick{position:absolute;left:26px;bottom:96px;width:120px;height:120px;border-radius:50%;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);pointer-events:auto;}
#stickknob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.34);}
#dashbtn,#ultbtn{position:absolute;right:26px;border-radius:50%;display:grid;place-items:center;
  font-size:10px;letter-spacing:.1em;pointer-events:auto;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);}
#dashbtn{width:74px;height:74px;bottom:110px;}
#ultbtn{width:86px;height:86px;bottom:28px;border-color:rgba(124,92,255,.5);color:#cbbcff;}
#ultbtn.ready{background:rgba(124,92,255,.3);box-shadow:0 0 22px rgba(124,92,255,.6);color:#fff;}

.bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;width:min(520px,70vw);text-align:center;}
.bossbar.hidden{display:none;}
.bossbar .bname{font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;margin-bottom:6px;color:#ffb3b3;}
.bossbar .btrack{height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(255,120,120,.35);border-radius:3px;overflow:hidden;}
#bossfill{height:100%;width:100%;background:linear-gradient(90deg,#7a1f2b,#ff5f6d);transition:width .15s linear;}
.fps{position:absolute;left:8px;top:52px;font-size:10px;opacity:.35;font-variant-numeric:tabular-nums;letter-spacing:.1em;}

.card.water{border-left:3px solid #63b7ff;}
.card.lightning{border-left:3px solid #ffe98a;}
.card.earth{border-left:3px solid #c08a4a;}
.ultpick{margin-top:26px;}
.ultlist{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.ultcard{cursor:pointer;width:200px;text-align:left;padding:12px;border-radius:10px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);transition:.12s;}
.ultcard:hover{border-color:rgba(255,255,255,.3);}
.ultcard.sel{border-color:#b9a6ff;background:rgba(124,92,255,.14);box-shadow:0 0 18px rgba(124,92,255,.25);}
.ultcard .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.55;margin-bottom:4px;}
.ultcard .n{font-size:14px;margin-bottom:6px;}
.ultcard .d{font-size:11px;line-height:1.45;opacity:.7;}

/* ---------- Academy ---------- */
.acad{width:min(980px,94vw);}
.acad-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.sealcount{font-size:30px;color:#ffd27a;font-variant-numeric:tabular-nums;}
.sealword{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;}
.acad-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;}
.acad-tabs{display:flex;gap:8px;margin-bottom:14px;}
.acad .tab{padding:8px 16px;border:1px solid rgba(255,255,255,.14);border-radius:8px;cursor:pointer;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;}
.acad .tab.active{opacity:1;border-color:#ffd27a;background:rgba(255,210,122,.10);}
.acad-body{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:56vh;overflow:auto;}
@media(max-width:760px){.acad-body{grid-template-columns:1fr;}}
.acad-row{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:10px;
  padding:10px 12px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:4px;}
.acad-row:hover{border-color:rgba(255,255,255,.32);background:rgba(255,255,255,.07);}
.acad-row .ar-name{font-size:14px;display:flex;align-items:center;gap:7px;}
.acad-row .ar-rank{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;}
.acad-row .ar-desc{font-size:11.5px;line-height:1.45;opacity:.68;}
.acad-row .ar-cost{font-size:11px;color:#ffd27a;letter-spacing:.08em;}
.acad-row.owned,.acad-row.maxed{opacity:.55;}
.acad-row.owned .ar-cost,.acad-row.maxed .ar-cost{color:#8fe0b0;}
.acad-row.locked{opacity:.45;cursor:not-allowed;}
.acad-row.selected{border-color:#b9a6ff;background:rgba(124,92,255,.12);}
.acad-row .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.acad-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;}
.perfect{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#ffd27a;}
.metastrip{display:flex;gap:14px;justify-content:center;align-items:center;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;opacity:.72;margin-top:6px;}
.metastrip .btn{padding:6px 14px;margin:0;font-size:10px;}
.acad-body.hidden{display:none;}

<script type="module">
/* Shinobi Survival — bundled 2026-11-14T04:10:57.483Z — 18 modules */

/* ---- src/core/rng.js ---- */
// Deterministic RNG. Same seed + same inputs = same run.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
class RNG {
  constructor(seed = 1337) {
    this.seed = seed >>> 0;
    this.next = mulberry32(this.seed);
  }
  float() { return this.next(); }
  range(a, b) { return a + this.next() * (b - a); }
  int(a, b) { return Math.floor(this.range(a, b + 1)); }
  chance(p) { return this.next() < p; }
  pick(arr) { return arr[Math.floor(this.next() * arr.length)]; }
  angle() { return this.next() * Math.PI * 2; }
  // weighted pick: [{w, ...}]
  weighted(list) {
    let total = 0;
    for (const it of list) total += it.w;
    let r = this.next() * total;
    for (const it of list) { r -= it.w; if (r <= 0) return it; }
    return list[list.length - 1];
  }
  shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(this.next() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }
}


/* ---- src/core/bus.js ---- */
// Minimal event bus (memo A4): systems emit and subscribe, they do not read each other.
class Bus {
  constructor() { this.map = new Map(); this.quiet = false; }
  // FIX Batch 1 (bug: reset cleared bus, killed audio/renderer):
  // clear() is now a no-op. Listeners are bound once for the lifetime of
  // the World (app.js / renderer.js / audio.js) and must survive reset().
  // World.reset() no longer calls clear() at all. If you really need to
  // wipe listeners in a test, call bus.map.clear() explicitly.
  clear() { /* intentionally no-op — see above */ }
  on(type, fn) {
    let a = this.map.get(type);
    if (!a) { a = []; this.map.set(type, a); }
    a.push(fn);
    return () => this.off(type, fn);
  }
  off(type, fn) {
    const a = this.map.get(type);
    if (!a) return;
    const i = a.indexOf(fn);
    if (i >= 0) a.splice(i, 1);
  }
  emit(type, payload) {
    if (this.quiet) return;
    const a = this.map.get(type);
    if (!a) return;
    for (let i = 0; i < a.length; i++) a[i](payload);
  }
}


/* ---- src/core/pools.js ---- */
// Fixed-capacity object pool with a free list (memo A5). Zero allocation in the hot loop.
class Pool {
  constructor(capacity, factory, reset) {
    this.capacity = capacity;
    this.factory = factory;
    this.reset = reset;
    this.items = new Array(capacity);
    this.active = [];
    this.free = new Array(capacity);
    for (let i = 0; i < capacity; i++) {
      const o = factory();
      o._idx = i;
      this.items[i] = o;
      this.free[i] = o;
    }
  }
  spawn() {
    if (this.free.length === 0) {
      // Hard cap: recycle the oldest active object rather than allocate.
      const oldest = this.active.shift();
      if (!oldest) return null;
      this.reset(oldest);
      this.active.push(oldest);
      return oldest;
    }
    const o = this.free.pop();
    this.reset(o);
    o.active = true;
    this.active.push(o);
    return o;
  }
  release(o) {
    if (!o.active) return;
    o.active = false;
    const i = this.active.indexOf(o);
    if (i >= 0) this.active.splice(i, 1);
    this.free.push(o);
  }
  releaseAt(i) {
    const o = this.active[i];
    o.active = false;
    const last = this.active.pop();
    if (last !== o) this.active[i] = last;
    this.free.push(o);
  }
  clear() {
    while (this.active.length) {
      const o = this.active.pop();
      o.active = false;
      this.free.push(o);
    }
  }
  get count() { return this.active.length; }
}


/* ---- src/core/grid.js ---- */
// Uniform spatial hash — collisions and crowd separation only (memo A6.3).
class Grid {
  constructor(cell = 56) {
    this.cell = cell;
    this.map = new Map();
    this.used = [];
    this.stamp = 0;
  }
  clear() {
    for (let i = 0; i < this.used.length; i++) this.map.get(this.used[i]).length = 0;
    this.used.length = 0;
  }
  key(cx, cy) { return (cx + 4096) * 8192 + (cy + 4096); }
  build(list) {
    this.clear();
    const c = this.cell;
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      if (!o.alive) continue;
      const k = this.key(Math.floor(o.x / c), Math.floor(o.y / c));
      let b = this.map.get(k);
      if (!b) { b = []; this.map.set(k, b); }
      if (b.length === 0) this.used.push(k);
      b.push(o);
    }
  }
  queryCircle(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = Math.floor((x - r) / c), x1 = Math.floor((x + r) / c);
    const y0 = Math.floor((y - r) / c), y1 = Math.floor((y + r) / c);
    for (let cx = x0; cx <= x1; cx++) {
      for (let cy = y0; cy <= y1; cy++) {
        const b = this.map.get(this.key(cx, cy));
        if (!b) continue;
        for (let i = 0; i < b.length; i++) out.push(b[i]);
      }
    }
    return out;
  }
  neighborsOf(o, out) {
    out.length = 0;
    const c = this.cell;
    const cx = Math.floor(o.x / c), cy = Math.floor(o.y / c);
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        const b = this.map.get(this.key(cx + i, cy + j));
        if (!b) continue;
        for (let k = 0; k < b.length; k++) out.push(b[k]);
      }
    }
    return out;
  }
}

// Ability data + cast behaviour for all five elements (Ability Starter Set, 04_COMBAT_PIPELINE.md).
// Every jutsu fires on its own cooldown at its declared targeting mode (memo C3/A1).

function statusActive(e, id, now) {
  const s = e.statuses[id];
  return !!s && s.t > 0;
}
function stacksOf(e, id) {
  const s = e.statuses[id];
  return s ? s.stacks : 0;
}
function applyStatus(world, e, id, opts = {}) {
  const def = STATUS[id];
  if (!def) return false;
  const now = world.t;
  let s = e.statuses[id];
  if (s && s.t > 0) {
    if (def.refresh === 'immune') return false;      // D-rules: no re-apply during/after break window
    if (def.refresh === 'none') return false;
    if (def.refresh === 'stack') {
      s.stacks = Math.min(def.maxStacks, s.stacks + (opts.stacks || 1));
      s.t = def.duration;
    } else {
      s.t = def.duration;
      s.stacks = Math.min(def.maxStacks, Math.max(s.stacks, opts.stacks || 1));
    }
    return true;
  }
  s = e.statuses[id] || (e.statuses[id] = { stacks: 0, t: 0, icd: 0, tick: 0 });
  s.stacks = Math.min(def.maxStacks, opts.stacks || 1);
  s.t = def.duration;
  s.tick = def.dotInterval || 0;
  world.bus.emit('status:applied', { enemy: e, id, source: opts.source });
  return true;
}
function clearStatus(e, id) {
  const s = e.statuses[id];
  if (s) { s.t = 0; s.stacks = 0; }
}

// FIX Batch 1 (bug: boss statuses never ticked / expired):
// tickStatuses now ticks BOTH enemies and bosses. Bosses use the same
// { statuses, pairIcd } shape as enemies, so one helper covers both.
// Frozen onBreak: when Frozen expires naturally, apply slow (slowT 2s).
function tickOne(world, e, dt) {
  if (!e.alive) return;
  if (!e.pairIcd) e.pairIcd = {};
  if (!e.statuses) e.statuses = {};
  // ICD bookkeeping lives on the status object; pair ICDs are keyed on the enemy.
  for (const k in e.pairIcd) {
    e.pairIcd[k] -= dt;
    if (e.pairIcd[k] <= 0) delete e.pairIcd[k];
  }
  for (const id in e.statuses) {
    const s = e.statuses[id];
    if (s.t <= 0) continue;
    const def = STATUS[id];
    if (!def) continue;
    s.t -= dt;
    if (def.dotPerStack && s.t > 0) {
      s.tick -= dt;
      if (s.tick <= 0) {
        s.tick += def.dotInterval;
        // FIX Batch 3 (Burn DoT): crit:false explicitly — Burn is FLAT (design: "Burn stacks add FLAT after multipliers").
        // world.js also skips all multipliers for dot:true, so this stays flat even if target is Staggered / Stoneward-marked.
        world.damageEnemy(e, def.dotPerStack * s.stacks, {
          element: 'fire', dot: true, silent: false, source: 'burning', crit: false,
        });
        if (!e.alive) break;
      }
    }
    if (s.t <= 0) {
      s.t = 0; s.stacks = 0;
      // Frozen onBreak: expiring Frozen leaves the target slowed.
      if (id === 'frozen' && def.onBreak) e.slowT = def.onBreak.duration;
      world.bus.emit('status:expired', { enemy: e, id });
    }
  }
}
function tickStatuses(world, dt) {
  const enemies = world.enemies.active || [];
  for (let i = enemies.length - 1; i >= 0; i--) tickOne(world, enemies[i], dt);
  // Bosses were missing here — that is why Aerated / Burning / Drenched
  // on a boss never expired and ICDs never cooled down.
  const bosses = world.bosses || [];
  for (let i = bosses.length - 1; i >= 0; i--) tickOne(world, bosses[i], dt);
  // Single-boss pointer (world.boss) is the same object as bosses[0],
  // so do NOT tick it again — that would double-tick.
}
function statusMoveMult(e) {
  let m = 1;
  for (const id in e.statuses) {
    const s = e.statuses[id];
    if (s.t <= 0) continue;
    const def = STATUS[id];
    if (def.moveMult !== undefined) m = Math.min(m, def.moveMult);
  }
  return m;
}
function statusDamageTakenMult(e) {
  let m = 1;
  for (const id in e.statuses) {
    const s = e.statuses[id];
    if (s.t <= 0) continue;
    const def = STATUS[id];
    if (def.damageBonus) m += def.damageBonus;
  }
  return m;
}

// FIX Batch 3 (spawn formulas): design is SpawnRate = min(12, 1.5 + 0.9*min), MaxOnScreen = min(900, 120 + 40*min).
// Code was min(16, 2.0 + 1.05*min) / min(900, 130 + 45*min) — at 10 min: 12.5/s vs 10.5/s (+19%), at 20 min: 16/s cap vs 12/s cap (+33%).
function spawnRate(minutes) { return Math.min(11, 1.5 + 0.9 * minutes); }
function maxOnScreen(minutes) { return Math.min(750, 120 + 40 * minutes); }
function podSize(minutes) { return 3 + Math.min(7, Math.floor(minutes / 4)); }

// SpawnRate(t) is enemies per second. Pairs and small pods add visual variety without
// multiplying the curve (a pod of 8 at 5/s would be 40 enemies a second).
function spawnPod(world) {
  const min = world.minutes;
  const types = world.spawnTable(min);
  const ang = world.rng.angle();
  const dist = world.rng.range(600, 780);
  const cx = world.player.x + Math.cos(ang) * dist;
  const cy = world.player.y + Math.sin(ang) * dist;
  // FIX Batch 3: spawnPod spawns exactly 1 enemy per call, so SpawnRate(t) IS enemies/sec.
  // Old code spawned 1-2 (30% chance of 2), so the real rate was 1.15x the formula — the curve never matched the design.
  const n = 1;
  for (let i = 0; i < n; i++) {
    if (world.enemies.count >= world.maxOnScreen()) break;
    const t = world.rng.weighted(types);
    const e = world.spawnEnemy(t.id, cx + world.rng.range(-46, 46), cy + world.rng.range(-46, 46));
    if (e) world.bus.emit('enemy:spawned', e);
  }
}
function updateEnemy(world, e, dt) {
  const p = world.player;
  const dx = p.x - e.x, dy = p.y - e.y;
  const dist = Math.hypot(dx, dy) || 1;
  const def = ENEMY_TYPES[e.type];

  if (e.stunT > 0) { e.stunT -= dt; return; }
  // FIX Batch 2 (Rooted / Stunned never stopped movement):
  // Stunned = fully stopped (no move, no blink, no fire). Rooted = no move / no blink, but an Archer can still shoot.
  if (statusActive(e, 'stunned')) return;
  const moveMult = statusMoveMult(e); // 0 when Rooted, 1 otherwise

  let mvx = dx / dist, mvy = dy / dist;
  let speed = e.speed * (e.slowT > 0 ? 0.5 : 1) * moveMult;

  if (def.ranged) {
    if (dist > def.keepMax) { /* approach */ }
    else if (dist < def.keepMin) { mvx = -mvx; mvy = -mvy; }
    else { const s = e.strafe || 1; mvx = -dy / dist * s; mvy = dx / dist * s; }
    e.fireT -= dt;
    if (e.fireT <= 0 && dist < 620) {
      e.fireT = def.fireCd;
      world.spawnEnemyProjectile({
        x: e.x, y: e.y, tx: p.x, ty: p.y,
        speed: def.projSpeed, damage: def.damage, color: '#7fc4ff',
      });
    }
  }

  // Soft separation so the crowd does not collapse into one pixel (grid, not O(n^2)).
  let sx = 0, sy = 0;
  const nb = world.grid.neighborsOf(e, world._nb);
  for (let i = 0; i < nb.length; i++) {
    const o = nb[i];
    if (o === e || !o.alive) continue;
    const ox = e.x - o.x, oy = e.y - o.y;
    const d2 = ox * ox + oy * oy;
    const rr = (e.r + o.r) * 0.9;
    if (d2 < rr * rr && d2 > 0.001) {
      const d = Math.sqrt(d2);
      sx += (ox / d) * (1 - d / rr);
      sy += (oy / d) * (1 - d / rr);
    }
  }
  mvx += sx * 1.4; mvy += sy * 1.4;
  const m = Math.hypot(mvx, mvy) || 1;
  e.vx = (mvx / m) * speed;
  e.vy = (mvy / m) * speed;
  e.x += e.vx * dt;
  e.y += e.vy * dt;

  // shunshin blink: closes distance in a jump — blocked while Rooted (moveMult 0)
  if (def.blinkCd && moveMult > 0) {
    e.blinkT = (e.blinkT === undefined ? def.blinkCd : e.blinkT) - dt;
    if (e.blinkT <= 0 && dist > 150 && dist < 640) {
      e.blinkT = def.blinkCd;
      const a = Math.atan2(dy, dx);
      e.x += Math.cos(a) * 170;
      e.y += Math.sin(a) * 170;
      world.bus.emit('blink', { x: e.x, y: e.y });
    }
  }

  // Stoneward: stone zone slows and marks for extra damage
  if (world.stonewardSlow && dist < 260) {
    e.stonewardMarked = true;
    speed *= 0.7 - Math.min(0.2, world.stonewardSlow);
  } else {
    e.stonewardMarked = false;
  }

  // contact damage
  e.touchT -= dt;
  const pr = p.r + e.r;

  if (e.touchT <= 0 && (p.x - e.x) ** 2 + (p.y - e.y) ** 2 < pr * pr) {
    e.touchT = 1.05;
    world.damagePlayer(def.damage, def.ranged ? 'ranged' : 'melee');
    if (def.drain) {
      world.player.chakra = Math.max(0, world.player.chakra - def.drain);
      world.bus.emit('drain', { x: p.x, y: p.y });
    }
    world.bus.emit('enemy:hitPlayer', e);
  }
}


/* ---- src/core/boss.js ---- */
// Bosses — The Ronin (5:00), The Twin (10:00), The Warden (15:00), The Sovereign (20:00).
// Each is a small state machine: approach → telegraph → resolve → recover, with a punish window.

const T = {
  approach: 'approach', tele: 'telegraph', strike: 'strike', recover: 'recover',
  dash: 'dash', counter: 'counter', vulnerable: 'vulnerable', cast: 'cast', dead: 'dead',
};
const BOSS_DEFS = {
  ronin: { id: 'ronin', name: 'The Ronin', r: 34, hp: 1700, atk: 13, speed: 62, touch: 9, seals: 20 },
  twinRanged: { id: 'twinRanged', name: 'The Twin · Bow', r: 26, hp: 900, atk: 11, speed: 88, touch: 6, seals: 20, pair: 'twinMelee' },
  twinMelee: { id: 'twinMelee', name: 'The Twin · Blade', r: 28, hp: 1100, atk: 12, speed: 104, touch: 8, seals: 20, pair: 'twinRanged' },
  warden: { id: 'warden', name: 'The Warden', r: 46, hp: 3200, atk: 16, speed: 34, touch: 12, seals: 60 },
  sovereign: { id: 'sovereign', name: 'The Sovereign', r: 52, hp: 4200, atk: 12, speed: 48, touch: 14, seals: 100 },
};
function createBoss(world, id) {
  const def = BOSS_DEFS[id];
  const ang = world.rng.angle();
  const dist = id === 'sovereign' ? 560 : 470;
  const b = {
    id, name: def.name, isBoss: true, alive: true,
    x: world.player.x + Math.cos(ang) * dist,
    y: world.player.y + Math.sin(ang) * dist,
    vx: 0, vy: 0, r: def.r,
    hp: def.hp * world.bossHpMult, maxHp: def.hp * world.bossHpMult,
    atk: def.atk, speed: def.speed, touch: def.touch,
    state: T.approach, stateT: 0, next: {}, phase: 1,
    face: 0, flash: 0, statuses: {}, pairIcd: {}, dmgMult: 1,
    kit: def, seals: def.seals, hitAccum: 0, swapDone: false,
    swapT: 12, armor: id === 'warden' ? 0.6 : 0, slowT: 0, _rooted: false, _stunned: false,
    addsT: 0, enraged: false, enrageAt: 130,
  };
  // per-boss timers
  if (id === 'ronin') { b.next = { slash: 2.4, dash: 6, counter: 10 }; }
  if (id === 'twinRanged') { b.next = { volley: 2.0, trap: 6 }; }
  if (id === 'twinMelee') { b.next = { combo: 1.6, charge: 5 }; }
  if (id === 'warden') { b.next = { bash: 3.5, slam: 6, throw: 10, spin: 15, charge: 6 }; }
  if (id === 'sovereign') { b.next = { barrage: 3, eruption: 8, combo: 5, frost: 12, kirin: 10, chain: 6, bomb: 0 }; }
  return b;
}
function updateBoss(world, b, dt) {
  if (!b.alive) return;
  const p = world.player;
  const dx = p.x - b.x, dy = p.y - b.y;
  const dist = Math.hypot(dx, dy) || 1;
  // FIX Batch 2 (Warden armor): face locks during telegraph / strike / vulnerable / dash.
  // If face always tracked the player, you could never get behind the Warden.
  const faceLocked = b.id === 'warden' && (b.state === 'telegraph' || b.state === 'strike' || b.state === 'vulnerable' || b.state === 'dash');
  if (!faceLocked) b.face = Math.atan2(dy, dx);
  // FIX Batch 2 (Rooted / Stunned): bosses respect statuses.
  b._stunned = statusActive(b, 'stunned');
  b._rooted = statusActive(b, 'rooted');
  if (b.slowT > 0) b.slowT -= dt;
  b.flash = Math.max(0, b.flash - dt * 4);
  b.stateT -= dt;
  b.hitAccum = Math.max(0, b.hitAccum - dt * 0.6);
  if (b.enrageAt !== undefined) b.enrageAt -= dt;

  for (const k in b.next) b.next[k] -= dt;

  // enrage windows per spec
  if (!b.enraged && b.enrageAt !== undefined && b.enrageAt <= 0) {
    b.enraged = true;
    b.dmgMult *= 1.4;
    world.bus.emit('boss:enrage', { x: b.x, y: b.y });
  }

  // Stunned boss: skip its state machine this tick (frozen in place, no attacks).
  // Phase transitions + contact below still run, so stun is a punish window, not a freeze of the fight.
  if (!b._stunned) {
    switch (b.id) {
      case 'ronin': updateRonin(world, b, dt, dist); break;
    case 'twinRanged': updateTwinRanged(world, b, dt, dist); break;
    case 'twinMelee': updateTwinMelee(world, b, dt, dist); break;
    case 'warden': updateWarden(world, b, dt, dist); break;
      case 'sovereign': updateSovereign(world, b, dt, dist); break;
    }
  }

  // FIX Batch 2 (Twin swap): every ~14s the Twins swap positions.
  // Only the Bow twin triggers it, so it fires once per cycle, not twice.
  if (b.id === 'twinRanged' && !b._stunned) {
    b.swapT = (b.swapT ?? 12) - dt;
    if (b.swapT <= 0) {
      const partner = (world.bosses || []).find((o) => o.id === 'twinMelee' && o.alive);
      if (partner) {
        const tx = b.x, ty = b.y; b.x = partner.x; b.y = partner.y; partner.x = tx; partner.y = ty;
        world.bus.emit('boss:swap', { x: b.x, y: b.y });
        world.bus.emit('boss:blink', { x: b.x, y: b.y });
        world.bus.emit('boss:blink', { x: partner.x, y: partner.y });
        b.swapT = 14; partner.swapT = 14;
      } else b.swapT = 14;
    }
  }

  // phase transitions by HP for Warden / Sovereign
  if (b.id === 'warden') {
    const pct = b.hp / b.maxHp;
    if (b.phase === 1 && pct <= 0.66) { b.phase = 2; world.bus.emit('boss:phase', { boss: b, phase: 2 }); }
    if (b.phase === 2 && pct <= 0.33) {
      b.phase = 3;
      world.bus.emit('boss:phase', { boss: b, phase: 3 });
      for (let i = 0; i < 2; i++) world.spawnEnemy('teleporter', b.x + world.rng.range(-90, 90), b.y + world.rng.range(-90, 90));
    }
  }
  if (b.id === 'sovereign') {
    const pct = b.hp / b.maxHp;
    const want = pct > 0.75 ? 1 : pct > 0.5 ? 2 : pct > 0.25 ? 3 : 4;
    if (want !== b.phase) {
      b.phase = want;
      w_phase(world, b);
    }
  }

  // contact damage
  const pr = b.r + p.r;
  if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < pr * pr && b.state !== T.dash) {
    b.touchT = (b.touchT || 0) - dt;
    if (b.touchT <= 0) { b.touchT = 0.7; world.damagePlayer(b.touch * b.dmgMult, 'boss'); }
  }
}

function w_phase(world, b) {
  world.bus.emit('boss:phase', { boss: b, phase: b.phase });
  if (b.phase === 2) { b.next.combo = 2; b.next.frost = 6; b.next.kirin = 99; }
  if (b.phase === 3) { b.next.kirin = 4; b.next.chain = 3; b.next.combo = 99; b.next.frost = 99; b.next.barrage = 99; b.next.eruption = 99; }
  if (b.phase === 4) {
    // FIX Batch 2 (Sovereign Phase 4 was empty): the finale now actually fights.
    // If the player extracts, the run ends. If they stay, Sovereign is faster + harder.
    b.dmgMult *= 1.15;
    b.next.barrage = 1; b.next.eruption = 3; b.next.kirin = 4; b.next.chain = 2; b.next.frost = 6; b.next.combo = 99;
    world.spawnZone({ x: b.x, y: b.y, r: 600, delay: 3.0, damage: b.atk * 10 * b.dmgMult, toPlayer: true, color: '#c9a8ff' });
    b.next.bomb = 99;
    for (let i = 0; i < 4; i++) world.spawnEnemy('teleporter', b.x + world.rng.range(-140, 140), b.y + world.rng.range(-140, 140));
    world.requestExtraction(b);
  }
}

function moveToward(b, p, speed, dt, keep = 0) {
  // FIX Batch 2: Rooted / Stunned stop boss movement. Slow (Frozen onBreak) halves it.
  if (b._stunned || b._rooted) return;
  if (b.slowT > 0) speed *= 0.5;
  const dx = p.x - b.x, dy = p.y - b.y;
  const d = Math.hypot(dx, dy) || 1;
  const s = d > keep ? speed : -speed * 0.5;
  b.x += (dx / d) * s * dt;
  b.y += (dy / d) * s * dt;
}

// ---------------- The Ronin ----------------
function updateRonin(world, b, dt, dist) {
  const p = world.player;
  switch (b.state) {
    case T.approach: {
      const want = 150;
      const spd = dist > want ? b.speed : b.speed * 0.35;
      moveToward(b, p, spd, dt, 0);
      if (b.next.dash <= 0) beginTelegraph(world, b, 'dash', 1.2, { kind: 'dash', len: 400 });
      else if (b.next.counter <= 0) beginCounter(world, b);
      else if (b.next.slash <= 0 && dist < 230) beginTelegraph(world, b, 'slash', 0.6, { kind: 'slash' });
      break;
    }
    case T.tele:
      if (b.stateT <= 0) {
        if (b.pending === 'slash') doSlash(world, b);
        else if (b.pending === 'dash') doDash(world, b);
      }
      break;
    case T.strike:
      if (b.stateT <= 0) { b.state = T.recover; b.stateT = 1.0; }
      break;
    case T.dash: {
      const t = 0.26;
      const step = 400 / t * dt;
      b.x += b.dashDir.x * step;
      b.y += b.dashDir.y * step;
      if (!b.hasHit) {
        const pr = b.r + p.r + 12;
        if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < pr * pr) {
          b.hasHit = true;
          world.damagePlayer(b.atk * 2 * b.dmgMult, 'boss');
        }
      }
      if (b.stateT <= 0) { b.state = T.recover; b.stateT = 1.5; b.next.dash = 8; }
      break;
    }
    case T.recover:
      if (b.stateT <= 0) b.state = T.approach;
      break;
    case T.counter:
      if (b.stateT <= 0) { b.state = T.vulnerable; b.stateT = 2.0; }
      break;
    case T.vulnerable:
      if (b.stateT <= 0) { b.state = T.approach; b.next.counter = 12; }
      break;
  }
}

function beginTelegraph(world, b, pending, time, extra) {
  b.state = T.tele; b.stateT = time; b.pending = pending;
  b.next[pending] = pending === 'slash' ? 4 : pending === 'dash' ? 99 : 8;
  if (pending === 'dash') {
    const p = world.player;
    b.dashDir = { x: p.x - b.x, y: p.y - b.y };
    const d = Math.hypot(b.dashDir.x, b.dashDir.y) || 1;
    b.dashDir.x /= d; b.dashDir.y /= d;
  }
  world.bus.emit('boss:telegraph', {
    kind: extra.kind, x: b.x, y: b.y, angle: b.face, t: time, len: extra.len || 400,
  });
}

function doSlash(world, b) {
  b.state = T.strike; b.stateT = 0.25;
  const p = world.player;
  const reach = 200;
  if (Math.hypot(p.x - b.x, p.y - b.y) < reach + p.r) {
    let a = Math.atan2(p.y - b.y, p.x - b.x) - b.face;
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    if (Math.abs(a) < Math.PI / 2) world.damagePlayer(b.atk * 1.5 * b.dmgMult, 'boss');
  }
  world.bus.emit('boss:slash', { x: b.x, y: b.y, angle: b.face, reach, life: 0.25 });
}

function doDash(world, b) {
  b.state = T.dash; b.stateT = 0.26; b.hasHit = false;
}

function beginCounter(world, b) {
  b.state = T.counter; b.stateT = 0.8;
  b.next.counter = 99;
  b.counterHit = false;
  world.bus.emit('boss:counter', { x: b.x, y: b.y });
}

// ---------------- The Twin ----------------
function updateTwinRanged(world, b, dt, dist) {
  const p = world.player;
  if (b.dead || !b.alive) return;
  // keep distance, teleport if cornered
  if (dist < 220 && b.state === T.approach) {
    b.x = p.x + (b.x - p.x) * 3;
    b.y = p.y + (b.y - p.y) * 3;
    world.bus.emit('boss:blink', { x: b.x, y: b.y });
  } else if (b.state === T.approach) {
    moveToward(b, p, b.speed, dt, 300);
  }
  if (b.state === T.tele) { if (b.stateT <= 0) fireVolley(world, b); return; }
  if (b.state === T.recover) { if (b.stateT <= 0) b.state = T.approach; return; }

  if (b.next.trap <= 0) {
    b.next.trap = 10;
    world.spawnZone({ x: p.x, y: p.y, r: 95, delay: 1.2, damage: b.atk * 1.2 * b.dmgMult, color: '#7c5cff' });
  }
  if (b.next.volley <= 0) {
    b.next.volley = 5;
    b.state = T.tele; b.stateT = 0.5;
    world.bus.emit('boss:telegraph', { kind: 'volley', x: b.x, y: b.y, angle: b.face, t: 0.5 });
  }
}

function fireVolley(world, b) {
  b.state = T.recover; b.stateT = 0.6;
  const p = world.player;
  const base = Math.atan2(p.y - b.y, p.x - b.x);
  for (let i = -2; i <= 2; i++) {
    const a = base + i * 0.16;
    world.spawnEnemyProjectile({
      x: b.x, y: b.y, tx: b.x + Math.cos(a) * 400, ty: b.y + Math.sin(a) * 400,
      speed: 300, damage: b.atk * 0.8 * b.dmgMult, color: '#ffb0b0',
    });
  }
  world.bus.emit('boss:volley', { x: b.x, y: b.y });
}

function updateTwinMelee(world, b, dt, dist) {
  const p = world.player;
  if (b.state === T.approach) {
    moveToward(b, p, b.speed, dt, 60);
    if (b.next.charge <= 0) {
      b.state = T.tele; b.stateT = 0.8; b.pending = 'charge';
      b.next.charge = 7;
      const d = { x: p.x - b.x, y: p.y - b.y };
      const l = Math.hypot(d.x, d.y) || 1;
      b.dashDir = { x: d.x / l, y: d.y / l };
      world.bus.emit('boss:telegraph', { kind: 'dash', x: b.x, y: b.y, angle: Math.atan2(b.dashDir.y, b.dashDir.x), t: 0.8, len: 300 });
    } else if (b.next.combo <= 0 && dist < 120) {
      b.state = T.strike; b.stateT = 0.3;
      b.next.combo = 3;
      world.damagePlayer(b.atk * 0.7 * 3 * b.dmgMult, 'boss');
      world.bus.emit('boss:slash', { x: b.x, y: b.y, angle: b.face, reach: 110, life: 0.22 });
    }
  } else if (b.state === T.tele) {
    if (b.stateT <= 0) { b.state = T.dash; b.stateT = 0.3; b.hasHit = false; }
  } else if (b.state === T.dash) {
    const step = 300 / 0.3 * dt;
    b.x += b.dashDir.x * step;
    b.y += b.dashDir.y * step;
    if (!b.hasHit) {
      const pr = b.r + p.r + 10;
      if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < pr * pr) {
        b.hasHit = true;
        world.damagePlayer(b.atk * 2 * b.dmgMult, 'boss');
      }
    }
    if (b.stateT <= 0) { b.state = T.recover; b.stateT = 0.8; }
  } else if (b.state === T.recover) {
    if (b.stateT <= 0) b.state = T.approach;
  } else if (b.state === T.strike) {
    if (b.stateT <= 0) b.state = T.approach;
  }
}

// ---------------- The Warden ----------------
function updateWarden(world, b, dt, dist) {
  const p = world.player;
  if (b.state === T.approach) {
    moveToward(b, p, b.speed, dt, 90);
    if (b.next.slam <= 0) {
      b.state = T.tele; b.stateT = 1.5; b.pending = 'slam';
      b.next.slam = 8;
      world.spawnZone({ x: b.x, y: b.y, r: 300, delay: 1.5, damage: b.atk * 3 * b.dmgMult, color: '#ffa060' });
      world.bus.emit('boss:telegraph', { kind: 'slam', x: b.x, y: b.y, angle: 0, t: 1.5 });
    } else if (b.next.bash <= 0) {
      b.state = T.tele; b.stateT = 0.6; b.pending = 'bash';
      b.next.bash = 5;
      world.bus.emit('boss:telegraph', { kind: 'slash', x: b.x, y: b.y, angle: b.face, t: 0.6 });
    } else if (b.phase >= 2 && b.next.throw <= 0) {
      b.next.throw = 10;
      for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2 + 0.4;
        world.spawnZone({ x: p.x + Math.cos(a) * 120, y: p.y + Math.sin(a) * 120, r: 85, delay: 1.0, damage: b.atk * 1.5 * b.dmgMult, color: '#e8c07a' });
      }
    } else if (b.phase >= 2 && b.next.spin <= 0) {
      b.next.spin = 15;
      b.state = T.tele; b.stateT = 2.0; b.pending = 'spin';
      world.spawnZone({ x: b.x, y: b.y, r: 260, delay: 2.0, damage: b.atk * 4 * b.dmgMult, color: '#ffd27a' });
    } else if (b.phase >= 3 && b.next.charge <= 0) {
      b.next.charge = 6;
      b.state = T.tele; b.stateT = 0.9; b.pending = 'charge';
      const d = { x: p.x - b.x, y: p.y - b.y };
      const l = Math.hypot(d.x, d.y) || 1;
      b.dashDir = { x: d.x / l, y: d.y / l };
      world.bus.emit('boss:telegraph', { kind: 'dash', x: b.x, y: b.y, angle: Math.atan2(b.dashDir.y, b.dashDir.x), t: 0.9, len: 400 });
    }
  } else if (b.state === T.tele) {
    if (b.stateT <= 0) {
      if (b.pending === 'bash') {
        // 180° front cone, knockback
        const p2 = world.player;
        let a = Math.atan2(p2.y - b.y, p2.x - b.x) - b.face;
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        if (Math.abs(a) < Math.PI / 2 && dist < 220 + b.r) {
          world.damagePlayer(b.atk * 2 * b.dmgMult, 'boss');
          world.pushPlayer(b.x, b.y, 200);
        }
        b.state = T.recover; b.stateT = 1.0;
      } else if (b.pending === 'slam') {
        b.state = T.vulnerable; b.stateT = 1.5;    // stationary punish window
      } else if (b.pending === 'spin') {
        b.state = T.recover; b.stateT = 1.2;
      } else if (b.pending === 'charge') {
        b.state = T.dash; b.stateT = 0.35; b.hasHit = false;
      }
    }
  } else if (b.state === T.dash) {
    const step = 400 / 0.35 * dt;
    b.x += b.dashDir.x * step;
    b.y += b.dashDir.y * step;
    if (!b.hasHit) {
      const pr = b.r + p.r + 14;
      if ((p.x - b.x) ** 2 + (p.y - b.y) ** 2 < pr * pr) {
        b.hasHit = true;
        world.damagePlayer(b.atk * 5 * b.dmgMult, 'boss');
      }
    }
    if (b.stateT <= 0) { b.state = T.recover; b.stateT = 1.0; }
  } else if (b.state === T.vulnerable) {
    if (b.stateT <= 0) b.state = T.approach;
  } else if (b.state === T.recover) {
    if (b.stateT <= 0) b.state = T.approach;
  }
}

// ---------------- The Sovereign ----------------
function updateSovereign(world, b, dt, dist) {
  const p = world.player;
  if (b.state === T.approach) {
    moveToward(b, p, b.speed, dt, 260);
    if (b.phase === 1) {
      if (b.next.eruption <= 0) {
        b.next.eruption = 10;
        for (let i = 0; i < 4; i++) {
          world.spawnZone({
            x: p.x + world.rng.range(-160, 160), y: p.y + world.rng.range(-160, 160),
            r: 110, delay: 1.5, damage: b.atk * 3 * b.dmgMult, color: '#ff7a2f',
          });
        }
      }
      if (b.next.barrage <= 0) { b.next.barrage = 4; fireVolley3(world, b); }
    } else if (b.phase === 2) {
      if (b.next.frost <= 0) {
        b.next.frost = 12;
        world.spawnZone({ x: b.x, y: b.y, r: 420, delay: 2.0, damage: b.atk * 4 * b.dmgMult, color: '#bfefff' });
        world.bus.emit('boss:telegraph', { kind: 'frost', x: b.x, y: b.y, angle: 0, t: 2.0 });
      }
      if (b.next.combo <= 0) { b.next.combo = 5; fireVolley3(world, b); }
    } else if (b.phase === 3) {
      if (b.next.kirin <= 0) {
        b.next.kirin = 15;
        world.spawnZone({ x: p.x, y: p.y, r: 130, delay: 2.0, damage: b.atk * 8 * b.dmgMult, color: '#ffe98a' });
        world.bus.emit('boss:telegraph', { kind: 'kirin', x: p.x, y: p.y, angle: 0, t: 2.0, len: 130 });
      }
      if (b.next.chain <= 0) {
        b.next.chain = 8;
        world.bus.emit('chain', { x1: b.x, y1: b.y, x2: p.x, y2: p.y });
        world.damagePlayer(b.atk * 1.2 * b.dmgMult, 'boss');
      }
    } else if (b.phase === 4) {
      // FIX Batch 2: Phase 4 finale — everything, faster.
      if (b.next.barrage <= 0) { b.next.barrage = 2; fireVolley3(world, b); }
      if (b.next.eruption <= 0) {
        b.next.eruption = 6;
        for (let i = 0; i < 2; i++) world.spawnZone({ x: p.x + world.rng.range(-160, 160), y: p.y + world.rng.range(-160, 160), r: 110, delay: 1.2, damage: b.atk * 3 * b.dmgMult, color: '#ff7a2f' });
      }
      if (b.next.kirin <= 0) {
        b.next.kirin = 8;

function fireVolley3(world, b) {
  const p = world.player;
  const base = Math.atan2(p.y - b.y, p.x - b.x);
  for (let i = -1; i <= 1; i++) {
    const a = base + i * 0.22;
    world.spawnEnemyProjectile({
      x: b.x, y: b.y, tx: b.x + Math.cos(a) * 400, ty: b.y + Math.sin(a) * 400,
      speed: 320, damage: b.atk * 1.5 * b.dmgMult, color: '#ff9a5a',
    });
  }
}

// Level-up pool: 4 active / 6 passive slots (design §5.5). Fusion needs both parents at rank >= 3.
const PASSIVES = {
  ember:   { id: 'ember',   name: 'Ember Focus',  max: 5, desc: '+10% jutsu damage.',            apply: (p) => { p.dmgMult += 0.10; } },
  focus:   { id: 'focus',   name: 'Inner Focus',  max: 5, desc: '+8% cooldown reduction (cap 70%).', apply: (p) => { p.cdr += 0.08; } },
  swift:   { id: 'swift',   name: 'Swiftness',    max: 5, desc: '+8% move speed.',               apply: (p) => { p.speedMult += 0.08; } },
  vitality:{ id: 'vitality',name: 'Vitality',     max: 5, desc: '+15 max HP, heals the same.',    apply: (p) => { p.maxHp += 15; p.hp = Math.min(p.maxHp, p.hp + 15); } },
  magnet:  { id: 'magnet',  name: 'Magnetism',    max: 5, desc: '+25% pickup radius.',            apply: (p) => { p.magnetMult += 0.25; } },
  precise: { id: 'precise', name: 'Precision',    max: 5, desc: '+6% critical chance.',           apply: (p) => { p.crit += 0.06; } },
};
const PASSIVE_SLOTS = 6;
const ACTIVE_SLOTS = 4;

// FIX Batch 5 (Breakthrough / Rank): design §8.1 — Genin 5/6 passives, Chunin 6/6, Jonin +1 dash charge, Kage Flow State.
// Rank is player progression, never reversed. Granted by Breakthrough, a level-up MENU OPTION that costs the pick.
const RANKS = ['genin', 'chunin', 'jonin', 'kage'];
const RANK_NAMES = { genin: 'Genin', chunin: 'Chunin', jonin: 'Jonin', kage: 'Kage' };
const BREAKTHROUGH = {
  chunin: { rank: 'chunin', level: 5, name: 'Breakthrough: Chunin', desc: 'Promote to Chunin. +1 passive slot (6/6). No stat boost — Rank grants unlocks, not boosts.' },
  jonin: { rank: 'jonin', level: 15, name: 'Breakthrough: Jonin', desc: 'Promote to Jonin. +1 dash charge (2 total).' },
  kage: { rank: 'kage', level: 25, name: 'Breakthrough: Kage', desc: 'Promote to Kage. Unlocks Flow State: 5s of 70% CDR on Ultimate, once per run.' },
};
function passiveSlotsForRank(rank) { return rank === 'genin' ? 5 : 6; }
function nextBreakthrough(world) {
  const rank = world.player?.rank || 'genin';
  const idx = RANKS.indexOf(rank);
  if (idx < 0 || idx >= RANKS.length - 1) return null;
  const next = RANKS[idx + 1];
  const def = BREAKTHROUGH[next];
  if (!def) return null;
  if ((world.player?.level || 1) < def.level) return null;
  return { kind: 'breakthrough', id: 'breakthrough-' + next, rank: next, w: 1, name: def.name, element: 'rank', tag: 'Breakthrough', desc: def.desc };
}

// FIX Batch 6 (Banish + Post-cap): design C4 + §8.3.
// Banish: 1 free per run + up to 2 bought in Academy (50 Seals each), max 3 per run.
// Banish removes ONE offered card from the pool for the rest of the run — it costs a Banish charge, NOT the pick.
// Post-cap (level 50): XP still fills, but the menu is heal 25% / reroll jutsu / +1 banish charge.
const BANISH_MAX = 3;
const BANISH_COST = 50;
function banishChoice(world, choice) {
  if (!choice || (choice.kind !== 'ability' && choice.kind !== 'passive')) return false;
  if ((world.player?.banishCharges || 0) <= 0) return false;
  if (!world.banished) world.banished = new Set();
  if (world.banished.has(choice.id)) return false;
  world.banished.add(choice.id);
  world.player.banishCharges--;
  if (world.bus) world.bus.emit('banish', { id: choice.id, kind: choice.kind, charges: world.player.banishCharges });
  return true;
}
function rollPostCapChoices(world) {
  return [
    { kind: 'postcap-heal', id: 'postcap-heal', w: 1, name: 'Second Wind', element: 'stat', tag: 'Post-cap', desc: 'Restore 25% of your health.' },
    { kind: 'postcap-reroll', id: 'postcap-reroll', w: 1, name: 'Reroll Jutsu', element: 'stat', tag: 'Post-cap', desc: 'Swap your lowest-rank jutsu for a new random jutsu at Rank 1. If none available, heal 25% instead.' },
    { kind: 'postcap-banish', id: 'postcap-banish', w: 1, name: '+1 Banish', element: 'stat', tag: 'Post-cap', desc: 'Gain +1 Banish charge (max 3). If already at max, heal 25% instead.' },
  ];
}
function abilityAvailable(world, id) {
  const def = ABILITIES[id];
  const owned = world.abilities.find((a) => a.id === id);
  if (owned) return owned.rank < MAX_RANK;
  if (world.abilities.length >= ACTIVE_SLOTS) return false;
  // Tier 2/3 are Academy unlocks (memo C5); without a save every tier is open.
  if (def.tier >= 2 && world.save && !world.save.arsenal[id]) return false;
  // Tier gating is on ability mastery only, never on player Rank (memo §2.4).
  if (def.tier === 1) return true;
  const parent = world.abilities.find((a) => a.id === def.parent);
  if (!parent) return false;
  return def.tier === 2 ? parent.rank >= 3 : parent.rank >= 5;
}
function passiveCount(world) {
  return world.passives.length;
}
function rollChoices(world, n = 3) {
  // FIX Batch 6: at level cap 50, the menu is post-cap offers, not normal picks.
  if ((world.player?.level || 1) >= 50) return rollPostCapChoices(world);
  const pool = [];
  // FIX Batch 4 (clan weighting): design p19 — clan-signature elements get 2x weight in the level-up roll.
  // Ember=Fire, Stoneward=Earth, Gale=Wind, Tide=Water. Lightning has no clan signature — available evenly.
  // Old code had no clan weighting at all, and a redundant * (owned ? 1 : 1) factor.
  const CLAN_SIGNATURE = { ember: 'fire', stoneward: 'earth', gale: 'wind', tide: 'water' };
  const signature = CLAN_SIGNATURE[world.clan] || null;
  for (const id in ABILITIES) {
    const def = ABILITIES[id];
    if (world.banished && world.banished.has(id)) continue;
    if (abilityAvailable(world, id)) {
      const owned = world.abilities.find((a) => a.id === id);
      const tierW = def.tier === 1 ? 2.6 : def.tier === 2 ? 1.9 : 1.1;
      const clanW = signature && def.element === signature ? 2 : 1;
      pool.push({
        kind: 'ability', id, w: (owned ? 2.2 : tierW) * clanW,
        name: ABILITIES[id].name, element: ABILITIES[id].element,
        tag: owned ? `Rank ${owned.rank + 1}` : 'New jutsu',
        desc: ABILITIES[id].desc,
      });
    }
  }
  // FIX Batch 5: Genin can only hold 5 passives. Chunin+ can hold 6.
  const maxPassives = passiveSlotsForRank(world.player?.rank || 'genin');
  if (world.passives.length < maxPassives) {
    for (const id in PASSIVES) {
      if (world.banished && world.banished.has(id)) continue;
      const owned = world.passives.find((p) => p.id === id);
      if (owned && owned.rank >= PASSIVES[id].max) continue;
      pool.push({
        kind: 'passive', id, w: owned ? 1.5 : 1.2,
        name: PASSIVES[id].name, element: 'stat',
        tag: owned ? `Rank ${owned.rank + 1}` : 'New',
        desc: PASSIVES[id].desc,
      });
    }
  }
  // Every pool can run dry (all abilities and passives maxed). The design's answer is a
  // heal/reroll card rather than an empty menu.
  if (pool.length === 0) {
    const bt0 = nextBreakthrough(world);
    const rec = { kind: 'recover', id: 'recover', w: 1, name: 'Second Wind', element: 'stat', tag: 'Recovery',
      desc: 'Restore 30% of your health.' };
    return bt0 ? [bt0, rec] : [rec];
  }
  const picked = [];
  const used = new Set();
  // FIX Batch 5: Breakthrough is a level-up MENU OPTION, not automatic. It appears as one of the 3 picks when eligible.
  // If the player skips it (picks another card), it stays available next level-up — Wait vs Promote is the choice.
  const bt = nextBreakthrough(world);
  if (bt) { picked.push(bt); used.add(bt.kind + bt.id); }
  // Early build: always offer at least one jutsu until the four slots are full, otherwise
  // the Prime/Detonate loop never starts and the run becomes passives-only.
  if (world.abilities.length < ACTIVE_SLOTS) {
    const abilities = pool.filter((c) => c.kind === 'ability');
    if (abilities.length) {
      const forced = world.rng.weighted(abilities);
      used.add(forced.kind + forced.id);
      picked.push(forced);
    }
  }
  let guard = 0;
  while (picked.length < n && pool.length > 0 && guard++ < 80) {
    const c = world.rng.weighted(pool);

    used.add(c.kind + c.id);

}
function applyChoice(world, choice) {
  if (choice.kind === 'postcap-heal') {
    const p = world.player;
    p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.25);
    return;
  }
  if (choice.kind === 'postcap-banish') {
    const p = world.player;
    if ((p.banishCharges || 0) >= BANISH_MAX) { p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.25); return; }
    p.banishCharges = Math.min(BANISH_MAX, (p.banishCharges || 0) + 1);
    return;
  }
  if (choice.kind === 'postcap-reroll') {
    // Swap lowest-rank owned jutsu for a new random jutsu at Rank 1. Fallback: heal 25%.
    const p = world.player;
    if (!world.abilities.length) { p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.25); return; }
    const sorted = [...world.abilities].sort((a, b) => a.rank - b.rank);
    const victim = sorted[0];
    const idx = world.abilities.findIndex((a) => a.id === victim.id);
    if (idx >= 0) world.abilities.splice(idx, 1);
    const candidates = [];
    for (const id in ABILITIES) {
      if (world.abilities.some((a) => a.id === id)) continue;
      if (world.banished && world.banished.has(id)) continue;
      if (id === victim.id) continue;
      if (abilityAvailable(world, id)) candidates.push(id);
    }
    if (!candidates.length) {
      // No replacement available — put the victim back and heal instead.
      world.abilities.splice(idx, 0, victim);
      p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.25);
      return;
    }
    const pickId = candidates[Math.floor(world.rng.next() * candidates.length)];
    const fresh = { id: pickId, rank: 1, cd: 0 };
    world.abilities.push(fresh);
    world.bus.emit('ability:gained', fresh);
    const def = ABILITIES[pickId];
    fresh.cd = Math.max(0.25, def.cd * (1 - Math.min(0.7, world.player.cdr)));
    fresh.cdMax = fresh.cd;
    return;
  }
  if (choice.kind === 'breakthrough') {
    // Promotion itself lives in world.promote() so rank, slots, dash and Flow stay in one place.
    if (typeof world.promote === 'function') world.promote(choice.rank);
    else { world.player.rank = choice.rank; world.player.maxPassives = passiveSlotsForRank(choice.rank); }
    return;
  }
  if (choice.kind === 'recover') {
    const p = world.player;
    p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.3);
    return;
  }
  if (choice.kind === 'ability') {
    let owned = world.abilities.find((a) => a.id === choice.id);
    if (owned) owned.rank = Math.min(MAX_RANK, owned.rank + 1);
    else {
      owned = { id: choice.id, rank: 1, cd: 0 };
      world.abilities.push(owned);
      world.bus.emit('ability:gained', owned);
    }
    const def = ABILITIES[choice.id];
    owned.cd = Math.max(0.25, def.cd * (1 - Math.min(0.7, world.player.cdr)));
    owned.cdMax = owned.cd;
    return;
  }
  let owned = world.passives.find((p) => p.id === choice.id);
  // FIX Batch 5: never exceed the rank's passive cap (Genin 5, Chunin+ 6) even if applyChoice is called directly.
  if (!owned && world.passives.length >= passiveSlotsForRank(world.player?.rank || 'genin')) return;
  if (owned) owned.rank = Math.min(PASSIVES[choice.id].max, owned.rank + 1);
  else { owned = { id: choice.id, rank: 1 }; world.passives.push(owned); }
  PASSIVES[choice.id].apply(world.player);
  world.recalc();
}

// Meta progression: Seals, the Academy, clans, Legacy, Ascension and the save file.
// Pure data + logic; the UI lives in src/ui/academy.js. Storage is injected (localStorage in the

const CLANS = {
  ember: {
    id: 'ember', name: 'Ember', unlockMinutes: 0,

// FIX Batch 7 (Academy costs to design §6): Pillar 1 is FLAT costs, not escalating growth.
// Design: HP +10 flat/node (max 10, 30 Seals each), Chakra +5%/node (max 10, 40 each), Move +2%/node (max 10, 40 each).
// dmg/mag are extras beyond the design's three — kept, but also flat for consistency.
const GLOBAL_UPGRADES = {
  hp: { id: 'hp', name: 'Constitution', desc: '+10 max HP per rank', max: 10, flat: 30 },
  dmg: { id: 'dmg', name: 'Chakra Flow', desc: '+6% jutsu damage per rank', max: 8, flat: 30 },

// FIX Batch 7: Clan tree is 5 nodes, 100 Seals each (design §6). Was 4 nodes at 45*1.6^rank + ascension scaling.
const CLAN_TREE = {
  ranks: 5,
  base: 100,
  growth: 1,
  flat: 100,
  // each rank gives the clan a small bonus in its own direction
  bonus: {
    ember: { crit: 0.03 },
    stoneward: { slow: 0.06 },
    gale: { hp: 0.05 },
    tide: { regen: 0.25 },
  },
};
const ARSENAL_COST = { 2: 50, 3: 150, ult: 200 };
// Ultimates: Cataclysm is the free starter. Spectral + Toad are 200 Seals each (design §6).
const ULTIMATES = [
  { id: 'spectral', name: 'Spectral Guard', desc: '90% reduction, status immunity, +50% damage for 5s.' },
  { id: 'toad', name: 'Summoning: Elder Toad', desc: 'A toad fights beside you.' },
];
const ULTIMATE_COST = 200;
function defaultSave() {
  return {
    v: 1,
    seals: 0,
    lifetimeSeals: 0,
    survivedMinutes: 0,
    runs: 0,
    wins: 0,
    clan: 'ember',
    clans: { ember: true, stoneward: false, gale: false, tide: false },
    global: { hp: 0, dmg: 0, spd: 0, mag: 0, chk: 0 },
    arsenal: {},
    clanTree: { ember: 0, stoneward: 0, gale: 0, tide: 0 },
    legacy: { ember: false, stoneward: false, gale: false, tide: false },
    ascension: 0,
    bestTime: 0,
    // FIX Batch 6 (Banish purchases): +1 Banish charge per purchase, max 2 bought, 50 Seals each. In-run charges = 1 + this.
    banish: 0,
    // FIX Batch 7: Ultimates owned beyond the free Cataclysm.
    ultimates: { spectral: false, toad: false },

// FIX Batch 7 (crash-mid-write): load tries main save, then the backup written by writeSave(). If both fail, fresh save.
// MINIMAL IP RENAME (2026-11-13): old saves use uchiha/nara/hyuga/uzumaki/susanoo.
// Migrate them to ember/stoneward/gale/tide/spectral so old saves keep working.
const CLAN_MIGRATION = { uchiha: 'ember', nara: 'stoneward', hyuga: 'gale', uzumaki: 'tide' };

function migrateSave(parsed) {
  if (!parsed || typeof parsed !== 'object') return parsed;
  if (parsed.clan && CLAN_MIGRATION[parsed.clan]) parsed.clan = CLAN_MIGRATION[parsed.clan];
  for (const [oldKey, newKey] of Object.entries(CLAN_MIGRATION)) {
    for (const bucket of ['clans', 'clanTree', 'legacy']) {
      if (parsed[bucket] && parsed[bucket][oldKey] !== undefined) {
        if (parsed[bucket][newKey] === undefined) parsed[bucket][newKey] = parsed[bucket][oldKey];
        delete parsed[bucket][oldKey];
      }
    }
  }
  if (parsed.ultimates) {
    for (const [oldKey, newKey] of Object.entries(ULTIMATE_MIGRATION)) {
      if (parsed.ultimates[oldKey] !== undefined) {
        if (parsed.ultimates[newKey] === undefined) parsed.ultimates[newKey] = parsed.ultimates[oldKey];

function loadSave(storage) {

  const tryParse = (raw) => {

    const parsed = migrateSave(JSON.parse(raw));

      global: { ...d.global, ...(parsed.global || {}) },
      ultimates: { ...d.ultimates, ...(parsed.ultimates || {}) },
      clanTree: { ...d.clanTree, ...(parsed.clanTree || {}) },
      clans: { ...d.clans, ...(parsed.clans || {}) },
      legacy: { ...d.legacy, ...(parsed.legacy || {}) },
      arsenal: { ...(parsed.arsenal || {}) },

  };
  try {
    const main = storage && tryParse(storage.getItem(SAVE_KEY));
    if (main) return main;
    const bak = storage && tryParse(storage.getItem(SAVE_KEY + '.bak'));
    if (bak) return bak;
    return d;
  } catch (e) {
    try {
      const bak = storage && tryParse(storage.getItem(SAVE_KEY + '.bak'));
      if (bak) return bak;
    } catch (e2) { /* fall through */ }

  }

// FIX Batch 7: write backup first, then main. A crash between the two leaves a valid backup for loadSave() to recover.
function writeSave(storage, save) {
  try {
    const json = JSON.stringify(save);
    storage.setItem(SAVE_KEY + '.bak', json);
    storage.setItem(SAVE_KEY, json);
    return true;
  } catch (e) { return false; }
}
function costOf(def, rank) {
  // FIX Batch 7: flat costs (design) return the flat price. Legacy base/growth defs still use the old formula.
  if (def.flat !== undefined) return def.flat;
  return Math.round(def.base * Math.pow(def.growth, rank));
}
function clanTreeCost(save, clan) {
  // FIX Batch 7: 100 Seals flat per node, no ascension scaling (design §6).
  return CLAN_TREE.flat !== undefined ? CLAN_TREE.flat : Math.round(CLAN_TREE.base * Math.pow(CLAN_TREE.growth, save.clanTree[clan] || 0));
}
function arsenalUnlocked(save, id) { return !!save.arsenal[id]; }
function clanUnlocked(save, id) {

}

}
function buyGlobal(save, id) {
  const def = GLOBAL_UPGRADES[id];
  const rank = save.global[id] || 0;
  if (rank >= def.max) return { ok: false, reason: 'maxed' };
  const cost = costOf(def, rank);
  if (save.seals < cost) return { ok: false, reason: 'seals', cost };
  save.seals -= cost;
  save.global[id] = rank + 1;
  return { ok: true, cost };
}
function buyArsenal(save, abilityId, tier) {
  if (save.arsenal[abilityId]) return { ok: false, reason: 'owned' };
  const cost = ARSENAL_COST[tier];
  if (!cost) return { ok: false, reason: 'tier' };
  if (save.seals < cost) return { ok: false, reason: 'seals', cost };
  save.seals -= cost;
  save.arsenal[abilityId] = true;
  return { ok: true, cost };
}

// FIX Batch 7: Ultimates cost 200 Seals each (design §6). Cataclysm is free and not in save.ultimates.
function buyUltimate(save, id) {
  if (!ULTIMATES.some((u) => u.id === id)) return { ok: false, reason: 'tier' };
  if (save.ultimates && save.ultimates[id]) return { ok: false, reason: 'owned' };
  if (save.seals < ULTIMATE_COST) return { ok: false, reason: 'seals', cost: ULTIMATE_COST };
  save.seals -= ULTIMATE_COST;
  if (!save.ultimates) save.ultimates = {};
  save.ultimates[id] = true;
  return { ok: true, cost: ULTIMATE_COST };
}
function buyClanTree(save, clan) {
  if (!clanUnlocked(save, clan)) return { ok: false, reason: 'locked' };
  const r = save.clanTree[clan] || 0;
  if (r >= CLAN_TREE.ranks) return { ok: false, reason: 'maxed' };
  const cost = clanTreeCost(save, clan);
  if (save.seals < cost) return { ok: false, reason: 'seals', cost };
  save.seals -= cost;
  save.clanTree[clan] = r + 1;
  // Completing a clan tree contributes its Legacy trait to every clan (memo C1/C2).
  if (save.clanTree[clan] >= CLAN_TREE.ranks) save.legacy[clan] = true;
  return { ok: true, cost };

// FIX Batch 6: Banish purchase — 50 Seals, max 2 bought (so max in-run charges = 1 free + 2 = 3).

function buyBanish(save) {

  if (bought >= BANISH_MAX_BOUGHT) return { ok: false, reason: 'maxed' };
  if (save.seals < BANISH_COST) return { ok: false, reason: 'seals', cost: BANISH_COST };

// ---------- run modifiers ----------
function metaModifiers(save) {
  const g = save.global;
  const clan = CLANS[save.clan] || CLANS.ember;
  const tree = save.clanTree[save.clan] || 0;
  const bonus = CLAN_TREE.bonus[save.clan] || {};

    clan: clan.id,
    // FIX Batch 2: base HP is 150 per design, not 170 (Ember was getting 136 instead of 120).
    // FIX Batch 7: Academy bonuses to design — HP +10/node, Speed +2%/node, Chakra +5%/node (was +12, +3%, +10%).
    maxHp: Math.round(150 * clan.hp) + (g.hp || 0) * 10 + (bonus.hp || 0) * 150,
    speedMult: clan.speed * (1 + (g.spd || 0) * 0.02),
    chakraMult: clan.chakra * (1 + (g.chk || 0) * 0.05),
    // FIX Batch 2 (Legacy only paid on Perfect Shinobi): each Legacy now gives +2.5% damage.
    // 4 Legacies = +10%, same as Perfect before, but 1-3 Legacies now do something.
    dmgMult: 1 + (g.dmg || 0) * 0.06 + Object.values(save.legacy).filter(Boolean).length * 0.025,
    magnetMult: 1 + (g.mag || 0) * 0.12,
    crit: 0.05 + (bonus.crit || 0) * tree,
    regen: (bonus.regen || 0) * tree,
    slow: (bonus.slow || 0) * tree,

  let seals = Math.floor(time / 60) * 2 + Math.round(level * 0.6);
  // boss rewards per the design table, scaled by how far the run got
  const bossSeals = [20, 40, 60, 100];
  for (let i = 0; i < Math.min(bosses, 4); i++) seals += bossSeals[i];

    save.ascension = save.ascension + 1;

  }

}

    // step 6 — prime / detonate

        const icdKey = def.detonatedBy + '>' + id;

        e.pairIcd[icdKey] = def.icd;

      }
    }

      if (this.clan === 'gale') {

    // DoT is not directional — Warden front armor does not block Burning ticks.
    if (!opts.dot && e.isBoss && e.id === 'warden' && e.state !== 'vulnerable' && e.state !== 'dead') {

      let diff = angToPlayer - (e.face || 0);
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) < Math.PI / 2) {

        dmg *= 0.4;
        if (before > 0) this.bus.emit('boss:armor', { x: e.x, y: e.y, blocked: before - dmg });
      }
