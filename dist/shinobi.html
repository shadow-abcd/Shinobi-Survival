// Renderer: reads world state, never writes it. Particles and popups live here.



const MAX_PARTICLES = 700;
class Renderer {
  constructor(canvas, world) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d', { alpha: false });
    this.world = world;
    this.sprites = buildSprites();
    this.cam = { x: 0, y: 0 };
    this.scale = 1;
    this.particles = [];
    this.numbers = [];
    this.rings = [];
    this.telegraphs = [];
    this.slashes = [];
    this.auras = [];
    this.beams = [];
    this.hurtFlash = 0;
    this.bossBarFlash = 0;
    this.bg = this.makePattern();
    this.props = this.makeProps();
    this.fireflies = this.makeFireflies();
    this.resize();
    this.bind();
  }

  makePattern() {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#0b0913';
    g.fillRect(0, 0, 256, 256);
    // faint grid
    g.strokeStyle = 'rgba(120,140,190,0.055)';
    g.lineWidth = 1;
    for (let i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i + 0.5, 0); g.lineTo(i + 0.5, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i + 0.5); g.lineTo(256, i + 0.5); g.stroke();
    }
    // grit
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * 256, y = Math.random() * 256;
      g.fillStyle = `rgba(${120 + Math.random() * 60},${110 + Math.random() * 50},${160 + Math.random() * 60},${0.02 + Math.random() * 0.04})`;
      g.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
    }
    return this.ctx.createPattern(c, 'repeat');
  }

  makeProps() {
    const out = [];
    let seed = 20261112;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let i = 0; i < 520; i++) {
      const x = (rnd() - 0.5) * 5200;
      const y = (rnd() - 0.5) * 5200;
      const r = rnd();
      out.push({
        x, y,
        kind: r < 0.40 ? 'grass' : r < 0.70 ? 'rock' : r < 0.92 ? 'bush' : 'tree',
        s: 0.6 + rnd() * 1.1,
        a: rnd() * Math.PI * 2,
        tone: rnd(),
      });
    }
    return out;
  }

  makeFireflies() {
    const out = [];
    let seed = 77123;
    const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
    for (let i = 0; i < 70; i++) {
      out.push({ x: (rnd() - 0.5) * 2400, y: (rnd() - 0.5) * 2400, p: rnd() * 10, sp: 0.4 + rnd() * 0.7 });
    }
    return out;
  }

  drawGround(dt) {
    const ctx = this.ctx, cam = this.cam;
    const halfW = this.world.viewW * 0.5 + 120, halfH = this.world.viewH * 0.5 + 120;
    ctx.save();
    // props
    for (let i = 0; i < this.props.length; i++) {
      const p = this.props[i];
      if (Math.abs(p.x - cam.x) > halfW || Math.abs(p.y - cam.y) > halfH) continue;
      const s = p.s;
      if (p.kind === 'grass') {
        ctx.strokeStyle = `rgba(70,110,90,${0.16 + p.tone * 0.14})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let k = -1; k <= 1; k++) {
          ctx.moveTo(p.x + k * 4 * s, p.y + 6 * s);
          ctx.quadraticCurveTo(p.x + k * 7 * s, p.y - 2 * s, p.x + k * 9 * s + Math.sin(p.a) * 4, p.y - 12 * s);
        }
        ctx.stroke();
      } else if (p.kind === 'rock') {
        ctx.fillStyle = 'rgba(28,30,44,0.95)';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, 11 * s, 8 * s, p.a, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(90,105,140,0.16)';
        ctx.beginPath(); ctx.ellipse(p.x - 2 * s, p.y - 2.5 * s, 7 * s, 4.5 * s, p.a, 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'tree') {
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.beginPath(); ctx.ellipse(p.x + 8 * s, p.y + 12 * s, 34 * s, 13 * s, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(34,24,18,0.95)';
        ctx.beginPath(); ctx.moveTo(p.x - 4 * s, p.y + 2 * s); ctx.lineTo(p.x + 4 * s, p.y + 2 * s);
        ctx.lineTo(p.x + 6 * s, p.y + 22 * s); ctx.lineTo(p.x - 6 * s, p.y + 22 * s); ctx.closePath(); ctx.fill();
        // layered canopy lobes
        const lobes = [[0, -14, 30], [-16, -4, 20], [16, -6, 19], [-6, -26, 18]];
        for (let li = 0; li < lobes.length; li++) {
          const [lx, ly, lr] = lobes[li];
          const cg = ctx.createRadialGradient(
            p.x + lx * s - 6 * s, p.y + ly * s - 8 * s, 2,
            p.x + lx * s, p.y + ly * s, lr * s);
          cg.addColorStop(0, 'rgba(38,68,54,0.98)');
          cg.addColorStop(0.75, 'rgba(17,34,28,0.98)');
          cg.addColorStop(1, 'rgba(9,18,16,0.98)');
          ctx.fillStyle = cg;
          ctx.beginPath(); ctx.arc(p.x + lx * s, p.y + ly * s, lr * s, 0, Math.PI * 2); ctx.fill();
        }
        ctx.strokeStyle = 'rgba(120,190,150,0.10)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(p.x, p.y - 14 * s, 26 * s, Math.PI * 1.15, Math.PI * 1.75); ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(24,38,34,0.9)';
        for (let k = 0; k < 3; k++) {
          const a = p.a + k * 2.1;
          ctx.beginPath();
          ctx.arc(p.x + Math.cos(a) * 7 * s, p.y + Math.sin(a) * 7 * s, 7 * s, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = 'rgba(90,150,120,0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // fireflies
    const t = this.world.t;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.fireflies.length; i++) {
      const f = this.fireflies[i];
      const x = f.x + Math.sin(t * f.sp * 0.6 + f.p) * 40;
      const y = f.y + Math.cos(t * f.sp * 0.5 + f.p * 1.7) * 40;
      if (Math.abs(x - cam.x) > halfW || Math.abs(y - cam.y) > halfH) continue;
      const a = 0.25 + Math.abs(Math.sin(t * 0.9 + f.p)) * 0.55;
      ctx.globalAlpha = a * 0.55;
      ctx.drawImage(this.sprites.glowGold, x - 9, y - 9, 18, 18);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();

    // player lantern light
    const p = this.world.player;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.085;
    const g = ctx.createRadialGradient(p.x, p.y, 10, p.x, p.y, 190);
    g.addColorStop(0, 'rgba(255,220,180,0.55)');
    g.addColorStop(1, 'rgba(255,180,120,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, 190, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = Math.floor(w * dpr);
    this.canvas.height = Math.floor(h * dpr);
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.w = w; this.h = h;
    // view: keep roughly a 1280x720 play area on desktop, zoom out a little on tall screens
    this.scale = Math.max(0.72, Math.min(1.55, Math.min(w / 940 , h / 560)));
    this.world.viewW = w / this.scale;
    this.world.viewH = h / this.scale;
  }

  bind() {
    const b = this.world.bus;
    b.on('damage', (e) => {
      const col = e.detonate ? '#ffd27a' : e.element === 'wind' ? '#8ff0dc' : e.element === 'fire' ? '#ffb073' : '#ffffff';
      this.popup(e.x, e.y, Math.round(e.amount), col, e.crit || e.detonate);
      for (let i = 0; i < (e.crit ? 6 : 2); i++) this.spark(e.x, e.y, col, 1);
    });
    b.on('kill', (e) => {
      for (let i = 0; i < 5; i++) this.spark(e.x, e.y, e.type === 'brute' ? '#ff9a7f' : '#ff7f9b', 1.4);
    });
    b.on('detonate', (e) => {
      this.ring(e.x, e.y, 12, e.r || 120, 0.35, e.element === 'fire' ? '#ffb073' : '#8ff0dc', 3);
      for (let i = 0; i < 14; i++) this.spark(e.x, e.y, '#ffd27a', 3.2);
    });
    b.on('fusion', (e) => {
      this.ring(e.x, e.y, 20, 150, 0.5, '#ffd27a', 4);
      for (let i = 0; i < 18; i++) this.spark(e.x, e.y, '#ffe6b0', 4);
    });
    b.on('cast', (e) => {
      const p = this.world.player;
      this.ring(p.x, p.y, 8, 26, 0.22, e.empowered ? '#c9a8ff' : '#9fb7d8', 2);
    });
    b.on('dash', (e) => {
      for (let i = 0; i < 10; i++) this.spark(e.x, e.y, '#9fdcff', 2.2);
    });
    b.on('player:hurt', () => { this.hurtFlash = 1; });
    b.on('gem', (e) => { this.ring(e.x, e.y, 2, 16, 0.2, '#8fe8ff', 1.5); });
    b.on('boss:telegraph', (e) => this.telegraphs.push({ ...e, life: e.t, total: e.t }));
    b.on('boss:slash', (e) => this.slashes.push({ ...e, life: 0.28, total: 0.28 }));
    b.on('boss:counter', (e) => this.auras.push({ x: e.x, y: e.y, life: 2.8, total: 2.8 }));
    b.on('boss:spawn', () => { this.ring(this.world.player.x, this.world.player.y, 40, 480, 0.9, '#ff6b6b', 5); });
    // FIX Batch 1: boss events that had no VFX now have one.
    // 'blink' already covers enemy Shunshin (enemies.js). Boss Twin also emits 'boss:blink'.
    b.on('boss:blink', (e) => this.ring(e.x, e.y, 4, 40, 0.3, '#b79bff', 2));
    b.on('boss:death', (e) => { this.ring(e.x, e.y, 20, 320, 0.7, '#ffd27a', 5); for (let i = 0; i < 24; i++) this.spark(e.x, e.y, '#ffd27a', 4); });
    b.on('boss:absorb', (e) => this.ring(this.world.player.x, this.world.player.y, 20, 260, 0.6, '#ff6b8a', 4));
    b.on('boss:phase', (e) => this.ring(e.boss ? e.boss.x : this.world.player.x, e.boss ? e.boss.y : this.world.player.y, 10, 180, 0.5, '#c9a8ff', 3));
    // FIX Batch 2: Warden armor + Twin swap now have feedback.
    b.on('boss:armor', (e) => { for (let i = 0; i < 3; i++) this.spark(e.x, e.y, '#c9a8ff', 1.2); });
    b.on('boss:swap', (e) => this.ring(e.x, e.y, 10, 90, 0.4, '#b79bff', 3));
    b.on('field:clear', () => { this.ring(this.world.player.x, this.world.player.y, 60, 520, 0.7, '#ffe6b0', 4); });
    b.on('ultimate', (e) => {
      this.ring(e.x, e.y, 20, 430, 0.6, '#ff9a3c', 8);
      for (let i = 0; i < 40; i++) this.spark(e.x, e.y, '#ffd27a', 6);
    });
    b.on('chain', (e) => this.beams.push({ ...e, life: 0.22, total: 0.22 }));
    b.on('blink', (e) => this.ring(e.x, e.y, 4, 40, 0.3, '#b79bff', 2));
    b.on('drain', (e) => this.ring(e.x, e.y, 10, 50, 0.3, '#5fe8c8', 2));
    b.on('boss:enrage', (e) => this.ring(e.x, e.y, 20, 180, 0.6, '#ff5f5f', 4));
    b.on('thorns', (e) => this.ring(e.x, e.y, 20, 120, 0.25, '#ffe98a', 2));
    b.on('barrier', (e) => this.ring(e.x, e.y, e.r * 0.6, e.r, 0.5, '#c08a4a', 3));
    b.on('summon', (e) => this.ring(e.x, e.y, 10, 60, 0.4, e.kind === 'toad' ? '#8fd8a0' : '#9fd8ff', 2));
    // FIX Batch 1: duplicate 'fusion' listener removed (was drawing 2 identical rings).
    b.on('buff', () => {});
    b.on('status:applied', (e) => {
      const def = STATUS[e.id];
      if (!def) return;
      this.ring(e.enemy.x, e.enemy.y, 4, e.enemy.r + 10, 0.25, def.color, 2);
    });
  }

  // ---------- vfx helpers ----------
  spark(x, y, color, speed = 1) {
    if (this.particles.length > MAX_PARTICLES) this.particles.shift();
    const a = Math.random() * Math.PI * 2;
    const s = (40 + Math.random() * 190) * speed;
    this.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.25 + Math.random() * 0.35, max: 0.6, color, size: 1 + Math.random() * 2.4,
    });
  }
  popup(x, y, text, color, big) {
    if (this.numbers.length > 90) this.numbers.shift();
    this.numbers.push({ x, y, text, color, big, life: big ? 0.95 : 0.7, max: big ? 0.95 : 0.7, vy: -46 });
  }
  ring(x, y, r0, r1, life, color, width = 2) {
    if (this.rings.length > 120) this.rings.shift();
    this.rings.push({ x, y, r0, r1, life, max: life, color, width });
  }

  // ---------- frame ----------
  draw(dt) {
    const w = this.world, p = w.player, ctx = this.ctx;
    const shake = w.shake;
    const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;

    // camera follow (and lead slightly in the direction of travel)
    const tx = p.x + p.vx * 0.12, ty = p.y + p.vy * 0.12;
    const lerp = 1 - Math.pow(0.001, dt);
    this.cam.x += (tx - this.cam.x) * lerp;
    this.cam.y += (ty - this.cam.y) * lerp;

    // background
    ctx.fillStyle = '#07060d';
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.save();
    ctx.globalAlpha = 0.9;
    ctx.translate((-this.cam.x * 0.55) % 256, (-this.cam.y * 0.55) % 256);
    ctx.fillStyle = this.bg;
    ctx.fillRect(-256, -256, this.w + 512, this.h + 512);
    ctx.restore();

    ctx.save();
    ctx.translate(this.w / 2 + sx, this.h / 2 + sy);
    ctx.scale(this.scale, this.scale);
    ctx.translate(-this.cam.x, -this.cam.y);

    this.drawGround(dt);
    this.drawZones();
    this.drawBarriers();
    this.drawFields(dt);
    this.drawGems();
    this.drawEnemies();
    this.drawSummons();
    this.drawBoss();
    this.drawPlayer();
    this.drawProjectiles();
    this.drawEffects(dt);

    ctx.restore();

    // world phase tint: forest → village → wasteland
    const tint = ['rgba(60,140,90,0.05)', 'rgba(190,110,50,0.07)', 'rgba(140,70,190,0.09)'][this.world.phase - 1] || null;
    if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, this.w, this.h); }

    // safe zone: brief calm between stages
    if (this.world.safeT > 0) {
      const p = this.world.player;
      ctx.save();
      ctx.translate(this.w / 2, this.h / 2);
      ctx.scale(this.scale, this.scale);
      ctx.translate(-this.cam.x, -this.cam.y);
      ctx.globalAlpha = 0.25 + Math.sin(this.world.t * 3) * 0.08;
      ctx.strokeStyle = '#8fe0b0';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, 300, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // vignette + hurt flash
    const g = ctx.createRadialGradient(this.w / 2, this.h / 2, Math.min(this.w, this.h) * 0.32,
      this.w / 2, this.h / 2, Math.max(this.w, this.h) * 0.78);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.72)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);
    if (this.hurtFlash > 0) {
      ctx.fillStyle = `rgba(220,40,60,${this.hurtFlash * 0.20})`;
      ctx.fillRect(0, 0, this.w, this.h);
      this.hurtFlash = Math.max(0, this.hurtFlash - dt * 3.2);
    }
    // low-health pulse
    if (this.world.player.hp / this.world.player.maxHp < 0.3 && this.world.state === 'playing') {
      const t = performance.now() / 1000;
      ctx.fillStyle = `rgba(200,20,40,${0.05 + Math.sin(t * 4) * 0.035})`;
      ctx.fillRect(0, 0, this.w, this.h);
    }
  }

  drawFields(dt) {
    const ctx = this.ctx;
    const S = this.sprites;
    // FIX Batch 1 (bug: every field looked like fire):
    // Field tint + glow now follow f.element.
    const FIELD_COLOR = { fire: '#ff7a2f', water: '#63b7ff', lightning: '#ffe98a', earth: '#c08a4a', wind: '#5fe8c8' };
    const FIELD_GLOW = { fire: S.glowFire, water: S.glowGold, lightning: S.glowGold, earth: S.glowGold, wind: S.glowWind };
    for (const f of this.world.fields.active) {
      const k = Math.max(0, f.life / 4);
      const fCol = FIELD_COLOR[f.element] || '#ff7a2f';
      const fGlow = FIELD_GLOW[f.element] || S.glowFire;
      if (f.kind === 'clone') {
        ctx.globalAlpha = 0.9;
        ctx.drawImage(S.player, f.x - 27, f.y - 27, 54, 54);
        ctx.globalAlpha = 0.5 + Math.sin(f.life * 22) * 0.25;
        ctx.fillStyle = '#ff7a2f';
        ctx.beginPath(); ctx.arc(f.x, f.y, 26, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }
      const pulse = 0.75 + Math.sin(performance.now() / 90 + f.x) * 0.12;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.30 * Math.min(1, k * 1.6) * pulse;
      ctx.drawImage(fGlow, f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      // flame tongues
      ctx.strokeStyle = hexA(fCol, 0.55);
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * Math.PI * 2 + f.life * 2;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * (0.55 + i * 0.18), a, a + 1.1);
        ctx.stroke();
      }
    }
  }

  drawZones() {
    const ctx = this.ctx;
    for (const z of this.world.zones.active) {
      const k = 1 - z.t / z.delay;              // 0 → 1 as the strike lands
      ctx.save();
      ctx.globalAlpha = 0.07 + k * 0.12;
      ctx.fillStyle = z.color;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.7 + k * 0.3;
      ctx.strokeStyle = z.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, Math.PI * 2); ctx.stroke();
      // the closing inner ring is the countdown: it meets the edge when the strike lands
      ctx.globalAlpha = 0.28 + k * 0.4;
      ctx.beginPath(); ctx.arc(z.x, z.y, Math.max(2, z.r * (1 - k)), 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.5 + k * 0.4;
      const t = z.r * 0.12;
      ctx.beginPath();
      ctx.moveTo(z.x - t, z.y); ctx.lineTo(z.x + t, z.y);
      ctx.moveTo(z.x, z.y - t); ctx.lineTo(z.x, z.y + t);
      ctx.stroke();
      ctx.restore();
    }
  }

  drawBarriers() {
    const ctx = this.ctx;
    for (const b of this.world.barriers.active) {
      const k = Math.min(1, b.life / 0.6);
      ctx.save();
      ctx.globalAlpha = 0.5 * k;
      ctx.strokeStyle = '#c08a4a';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.16 * k;
      ctx.fillStyle = '#c08a4a';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      // rocks around the ring
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2;
        ctx.fillStyle = '#5b4632';
        ctx.beginPath();
        ctx.ellipse(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r, 9, 7, a, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  drawSummons() {
    const ctx = this.ctx, S = this.sprites;
    for (const su of this.world.summons.active) {
      const size = su.kind === 'toad' ? 96 : su.kind === 'rockGolem' ? 64 : 52;
      let img = S.player;
      if (su.kind === 'toad') img = S.toad;
      else if (su.kind === 'rockGolem') img = S.golem;
      else if (su.kind === 'waterClone') img = S.waterClone;
      ctx.save();
      ctx.translate(su.x, su.y);
      if (su.kind !== 'toad') ctx.rotate(su.angle + Math.PI / 2);
      ctx.globalAlpha = su.life < 1 ? 0.45 + Math.sin(su.life * 18) * 0.3 : 1;
      ctx.drawImage(img, -size / 2, -size / 2, size, size);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  drawGems() {
    const ctx = this.ctx, S = this.sprites;
    for (const g of this.world.gems.active) {
      const bob = Math.sin(g.t * 5 + g.x * 0.05) * 2.4;
      ctx.globalAlpha = 0.95;
      ctx.drawImage(S.gem, g.x - 8, g.y - 8 + bob, 16, 16);
    }
    ctx.globalAlpha = 1;
  }

  drawEnemies() {
    const ctx = this.ctx, S = this.sprites, w = this.world;
    const list = w.enemies.active;
    const halfW = w.viewW * 0.5 + 90, halfH = w.viewH * 0.5 + 90;
    const cam = this.cam;

    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive) continue;
      if (Math.abs(e.x - cam.x) > halfW || Math.abs(e.y - cam.y) > halfH) continue;
      const sp = S[e.type] || S.fodder;
      const size = (e.r + 10) * 2;
      const scale = e.spawnT > 0 ? 0.6 + (1 - e.spawnT / 0.25) * 0.4 : 1;
      const bob = Math.sin(w.t * 6 + e.x * 0.03) * 1.5;

      // status glows behind
      const aer = e.statuses.aerated, burn = e.statuses.burning;
      if (aer && aer.t > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.42;
        ctx.drawImage(S.glowWind, e.x - 34, e.y - 34, 68, 68);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }
      if (burn && burn.t > 0) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.30 + Math.min(0.3, burn.stacks * 0.06);
        ctx.drawImage(S.glowFire, e.x - 30, e.y - 34, 60, 60);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }

      ctx.save();
      ctx.translate(e.x, e.y + bob);
      ctx.scale(scale, scale);
      ctx.drawImage(sp, -size / 2, -size / 2, size, size);
      if (e.flash > 0.02) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = e.flash * 0.55;
        ctx.drawImage(sp, -size / 2, -size / 2, size, size);
        ctx.globalCompositeOperation = 'source-over';
        ctx.globalAlpha = 1;
      }
      ctx.restore();

      // status pips: the prime/detonate loop has to be readable at a glance
      let pip = 0;
      for (const sid in e.statuses) {
        const st = e.statuses[sid];
        if (st.t <= 0) continue;
        const def = STATUS[sid];
        if (!def || pip >= 4) continue;
        const px = e.x - e.r + pip * 5.5;
        const py = e.y + e.r + 7;
        ctx.fillStyle = def.color;
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(px, py, 1.9, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        pip++;
      }

      // HP pip for damaged tough enemies
      if (e.hp < e.maxHp && e.type !== 'fodder') {
        const bw = e.r * 1.9;
        const pct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(e.x - bw / 2, e.y - e.r - 9, bw, 3.5);
        ctx.fillStyle = pct > 0.5 ? '#7fe0a0' : pct > 0.25 ? '#ffd27a' : '#ff6b6b';
        ctx.fillRect(e.x - bw / 2, e.y - e.r - 9, bw * pct, 3.5);
      }
    }
  }

  drawPlayer() {
    const ctx = this.ctx, S = this.sprites, p = this.world.player;
    const size = 58;
    // dash trail
    if (p.dashT > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.22;
      for (let i = 1; i <= 2; i++) {
        ctx.drawImage(S.glowWind, p.x - 26 - p.dashDir.x * i * 18, p.y - 26 - p.dashDir.y * i * 18, 52, 52);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    // ground ring anchors the player above a dense crowd
    ctx.strokeStyle = 'rgba(150,235,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 11, 17, 7, 0, 0, Math.PI * 2); ctx.stroke();
    // buff auras
    if (this.world.buffs.spectral > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + Math.sin(this.world.t * 6) * 0.12;
      ctx.strokeStyle = '#c9a8ff';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 44, 0, Math.PI * 2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    if (this.world.buffs.lightningArmor > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = '#ffe98a';
      ctx.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const a = this.world.t * 9 + i * 1.3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 26, a, a + 0.6);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    // chakra aura when the ultimate is ready
    if (p.chakra >= 100) {
      const t = performance.now() / 1000;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + Math.sin(t * 5) * 0.15;
      ctx.drawImage(S.glowGold, p.x - 46, p.y - 46, 92, 92);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    const wobble = p.moving ? Math.sin(this.world.t * 14) * 0.05 : 0;
    ctx.rotate(Math.atan2(p.facing.y, p.facing.x) + Math.PI / 2 + wobble);
    if (p.iframe > 0) ctx.globalAlpha = 0.55 + Math.sin(this.world.t * 40) * 0.25;
    ctx.drawImage(S.player, -size / 2, -size / 2, size, size);
    ctx.restore();
    ctx.globalAlpha = 1;

    if (p.hitFlash > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = p.hitFlash * 0.5;
      ctx.drawImage(S.glowWhite, p.x - 40, p.y - 40, 80, 80);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
  }

  drawBoss() {
    const ctx = this.ctx, S = this.sprites;
    for (const boss of this.world.bosses) {
      if (boss.alive) this.drawOneBoss(boss, S, ctx);
    }
  }

  drawOneBoss(b, S, ctx) {
    const sprite = S[b.id] || S.bossRonin || S.boss;
    const size = b.r * 3.4;
    const bob = Math.sin(this.world.t * 3) * 2;
    // FIX Batch 1 (bug: boss statuses invisible):
    // Same glows as enemies, so Aerated / Burning on a boss is readable.
    const aer = b.statuses && b.statuses.aerated, burn = b.statuses && b.statuses.burning;
    if (aer && aer.t > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.42;
      ctx.drawImage(S.glowWind, b.x - 50, b.y - 50, 100, 100);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    if (burn && burn.t > 0) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.30 + Math.min(0.3, burn.stacks * 0.06);
      ctx.drawImage(S.glowFire, b.x - 46, b.y - 50, 92, 92);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // counter stance aura
    if (b.state === 'counter' || b.phase === 3) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.4 + Math.sin(this.world.t * 12) * 0.2;
      ctx.strokeStyle = '#8fb8ff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 16, 0, Math.PI * 2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // menacing under-glow so the boss reads from across the arena
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35;
    ctx.drawImage(S.glowFire, b.x - 90, b.y - 90, 180, 180);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    ctx.save();
    ctx.translate(b.x, b.y + bob);
    ctx.rotate(b.face + Math.PI / 2);
    ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
    // sword
    ctx.strokeStyle = 'rgba(230,240,255,0.85)';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, -b.r - 46); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -8); ctx.lineTo(0, -b.r - 46); ctx.stroke();
    ctx.restore();

    // Boss status pips (same as enemies, below the boss)
    if (b.statuses) {
      let pip = 0;
      for (const sid in b.statuses) {
        const st = b.statuses[sid];
        if (!st || st.t <= 0) continue;
        const def = STATUS[sid];
        if (!def || pip >= 4) continue;
        const px = b.x - b.r + pip * 8;
        const py = b.y + b.r + 10;
        ctx.fillStyle = def.color;
        ctx.globalAlpha = 0.95;
        ctx.beginPath(); ctx.arc(px, py, 2.8, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        pip++;
      }
    }

    // FIX Batch 2: Warden front armor is visible — a shield arc on the front 180 deg.
    // No arc when vulnerable: that is when you hit him from anywhere.
    if (b.id === 'warden' && b.state !== 'vulnerable' && b.alive) {
      ctx.strokeStyle = 'rgba(201,168,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r + 8, (b.face || 0) - Math.PI / 2, (b.face || 0) + Math.PI / 2);
      ctx.stroke();
    }

    if (b.flash > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = b.flash * 0.4;
      ctx.drawImage(S.glowWhite, b.x - 70, b.y - 70, 140, 140);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
  }

  drawProjectiles() {
    const ctx = this.ctx, S = this.sprites;
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.world.projectiles.active) {
      const el = p.element;
      ctx.globalAlpha = 0.95;
      if (el === 'wind') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.strokeStyle = '#9ff5e4';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 12, -1.1, 1.1); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.arc(0, 0, 12, -0.9, 0.9); ctx.stroke();
        ctx.restore();
      } else if (el === 'lightning') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.strokeStyle = '#fff8d0';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-16, 0); ctx.lineTo(-9, -5); ctx.lineTo(-2, 3); ctx.lineTo(6, -3); ctx.lineTo(14, 0);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,233,138,0.5)';
        ctx.lineWidth = 7;
        ctx.stroke();
        ctx.restore();
      } else if (el === 'water') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, 12);
        grad.addColorStop(0, '#dff4ff');
        grad.addColorStop(0.6, '#63b7ff');
        grad.addColorStop(1, 'rgba(60,140,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(160,220,255,0.6)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(-6, 0, 7, 1.2, 5.0); ctx.stroke();
        ctx.restore();
      } else if (el === 'earth') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx));
        ctx.fillStyle = '#d8b07a';
        ctx.beginPath();
        ctx.moveTo(12, 0); ctx.lineTo(-8, -7); ctx.lineTo(-4, 0); ctx.lineTo(-8, 7);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(90,60,30,0.8)';
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.restore();
      } else {
        const glow = 46;
        ctx.drawImage(S.orbFire, p.x - glow / 2, p.y - glow / 2, glow, glow);
        ctx.fillStyle = '#fff3d8';
        ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
        // ember trail
        if (Math.random() < 0.6) {
          ctx.fillStyle = 'rgba(255,150,60,0.5)';
          ctx.fillRect(p.x - p.vx * 0.012, p.y - p.vy * 0.012, 2, 2);
        }
      }
    }
    for (const p of this.world.eproj.active) {
      ctx.globalAlpha = 0.95;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.atan2(p.vy, p.vx));
      ctx.drawImage(S.orbEnemy, -11, -11, 22, 22);
      ctx.fillStyle = '#eaf6ff';
      ctx.beginPath(); ctx.ellipse(0, 0, 4.2, 1.8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  drawEffects(dt) {
    const ctx = this.ctx;

    // expanding rings
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i];
      r.life -= dt;
      if (r.life <= 0) { this.rings.splice(i, 1); continue; }
      const k = 1 - r.life / r.max;
      const rad = r.r0 + (r.r1 - r.r0) * (1 - Math.pow(1 - k, 2));
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.75;
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.width;
      ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI * 2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // cones (great fire annihilation)
    for (const c of this.world.cones.active) {
      const k = 1 - c.life / c.total;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.5;
      const grd = ctx.createRadialGradient(c.x, c.y, 10, c.x, c.y, c.range);
      grd.addColorStop(0, '#ffd9a0');
      grd.addColorStop(0.6, '#ff7a2f');
      grd.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.arc(c.x, c.y, c.range * (0.75 + k * 0.25), c.angle - c.halfAngle, c.angle + c.halfAngle);
      ctx.closePath();
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // bursts
    for (const b of this.world.bursts.active) {
      const k = 1 - b.life / b.total;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.55;
      const rad = b.r * (0.7 + k * 0.4);
      const grd = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, rad);
      grd.addColorStop(0, 'rgba(255,250,235,0.85)');
      grd.addColorStop(0.65, b.color || '#ff9a3c');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(b.x, b.y, rad, 0, Math.PI * 2); ctx.fill();
      // element signature on top of the splash
      if (b.element === 'earth') {
        ctx.strokeStyle = '#c9a06a';
        ctx.lineWidth = 3;
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + k;
          ctx.beginPath();
          ctx.moveTo(b.x + Math.cos(a) * rad * 0.2, b.y + Math.sin(a) * rad * 0.2);
          ctx.lineTo(b.x + Math.cos(a) * rad * 0.95, b.y + Math.sin(a) * rad * 0.95);
          ctx.stroke();
        }
      } else if (b.element === 'water') {
        ctx.strokeStyle = 'rgba(160,220,255,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, b.y, rad * 0.9, 0, Math.PI * 2); ctx.stroke();
      } else if (b.element === 'lightning') {
        ctx.strokeStyle = 'rgba(255,248,200,0.9)';
        ctx.lineWidth = 2.5;
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2 + k * 2;
          ctx.beginPath();
          ctx.moveTo(b.x, b.y);
          ctx.lineTo(b.x + Math.cos(a) * rad, b.y + Math.sin(a) * rad);
          ctx.stroke();
        }
      } else if (b.element === 'wind') {
        ctx.strokeStyle = 'rgba(160,245,220,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(b.x, b.y, rad * 0.8, k * 6, k * 6 + 2.2); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // boss telegraphs
    for (let i = this.telegraphs.length - 1; i >= 0; i--) {
      const t = this.telegraphs[i];
      t.life -= dt;
      if (t.life <= 0) { this.telegraphs.splice(i, 1); continue; }
      const k = 1 - t.life / t.total;
      ctx.save();
      ctx.translate(t.x, t.y);
      if (t.kind === 'slash') {
        ctx.rotate(t.angle);
        ctx.fillStyle = `rgba(255,210,90,${0.10 + k * 0.16})`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 200, -Math.PI / 2, Math.PI / 2);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = `rgba(255,230,140,${0.5 + k * 0.4})`;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 200, -Math.PI / 2, Math.PI / 2); ctx.stroke();
      } else if (t.kind === 'dash') {
        ctx.rotate(t.angle);
        const len = t.len || 400;
        ctx.fillStyle = `rgba(255,70,70,${0.10 + k * 0.2})`;
        ctx.fillRect(0, -16, len, 32);
        ctx.strokeStyle = `rgba(255,120,120,${0.4 + k * 0.4})`;
        ctx.lineWidth = 2;
        ctx.strokeRect(0, -16, len, 32);
        // arrow head so the direction is unmistakable
        ctx.fillStyle = `rgba(255,120,120,${0.5 + k * 0.4})`;
        ctx.beginPath();
        ctx.moveTo(len, 0); ctx.lineTo(len - 26, -20); ctx.lineTo(len - 26, 20);
        ctx.closePath(); ctx.fill();
      } else if (t.kind === 'slam') {
        ctx.strokeStyle = `rgba(255,180,90,${0.4 + k * 0.5})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 300, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 300 * (1 - k * 0.8), 0, Math.PI * 2); ctx.stroke();
      } else if (t.kind === 'frost') {
        ctx.strokeStyle = `rgba(180,235,255,${0.35 + k * 0.45})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 420, 0, Math.PI * 2); ctx.stroke();
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * 420 * 0.25, Math.sin(a) * 420 * 0.25);
          ctx.lineTo(Math.cos(a) * 420, Math.sin(a) * 420);
          ctx.stroke();
        }
      } else if (t.kind === 'kirin') {
        ctx.strokeStyle = `rgba(255,240,150,${0.5 + k * 0.5})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, 130, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -600);
        ctx.lineTo(-30, -400); ctx.lineTo(20, -260); ctx.lineTo(-14, -120); ctx.lineTo(0, 0);
        ctx.stroke();
      } else if (t.kind === 'volley') {
        ctx.fillStyle = `rgba(255,150,150,${0.12 + k * 0.2})`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 420, t.angle - 0.45, t.angle + 0.45);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // slash arcs (after the fact)
    for (let i = this.slashes.length - 1; i >= 0; i--) {
      const s = this.slashes[i];
      s.life -= dt;
      if (s.life <= 0) { this.slashes.splice(i, 1); continue; }
      const k = 1 - s.life / s.total;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = '#fff3c4';
      ctx.lineWidth = 10 * (1 - k) + 2;
      ctx.beginPath(); ctx.arc(0, 0, s.reach, -Math.PI / 2 - 0.2, Math.PI / 2 + 0.2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    // lightning beams
    for (let i = this.beams.length - 1; i >= 0; i--) {
      const b = this.beams[i];
      b.life -= dt;
      if (b.life <= 0) { this.beams.splice(i, 1); continue; }
      const k = b.life / b.total;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = k * 0.9;
      ctx.strokeStyle = '#fff6c8';
      ctx.lineWidth = 3 + k * 3;
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      const segs = 4;
      for (let k2 = 1; k2 <= segs; k2++) {
        const t = k2 / segs;
        const x = b.x1 + (b.x2 - b.x1) * t + (Math.random() - 0.5) * 18;
        const y = b.y1 + (b.y2 - b.y1) * t + (Math.random() - 0.5) * 18;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    // particles
    ctx.globalCompositeOperation = 'lighter';
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= dt;
      if (p.life <= 0) { this.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.94; p.vy *= 0.94;
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    // damage numbers
    ctx.textAlign = 'center';
    for (let i = this.numbers.length - 1; i >= 0; i--) {
      const n = this.numbers[i];
      n.life -= dt;
      if (n.life <= 0) { this.numbers.splice(i, 1); continue; }
      const k = 1 - n.life / n.max;
      n.y += n.vy * dt;
      n.vy *= 0.94;
      ctx.globalAlpha = Math.min(1, (1 - k) * 2.2);
      ctx.font = `${n.big ? 700 : 600} ${n.big ? 19 : 14}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillText(n.text, n.x + 1.2, n.y + 1.6);
      ctx.fillStyle = n.color;
      ctx.fillText(n.text, n.x, n.y);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }
}

// The Academy: Seals spending between runs — global stats, arsenal unlocks, clan trees.
function academyHTML(save) {
  const sealLine = `<div class="acad-head"><div><span class="sealcount">${save.seals}</span> <span class="sealword">Seals</span></div>
    <div class="acad-meta">Ascension ${save.ascension} · ${save.wins} wins · best ${Math.floor(save.bestTime / 60)}:${String(Math.floor(save.bestTime % 60)).padStart(2, '0')}</div></div>`;

  const global = Object.values(GLOBAL_UPGRADES).map((u) => {
    const rank = save.global[u.id] || 0;
    const maxed = rank >= u.max;
    const cost = costOf(u, rank);
    return `<div class="acad-row ${maxed ? 'maxed' : ''}" data-kind="global" data-id="${u.id}">
      <div class="ar-name">${u.name}<span class="ar-rank">${rank}/${u.max}</span></div>
      <div class="ar-desc">${u.desc}</div>
      <div class="ar-cost">${maxed ? 'maxed' : cost + ' seals'}</div>
    </div>`;
  }).join('');

  // FIX Batch 6 (Banish purchases): +1 Banish charge per run, 50 Seals each, max 2 bought (max 3 per run total).
  const banishBought = save.banish || 0;
  const banishMaxed = banishBought >= BANISH_MAX_BOUGHT;
  const banishRow = `<div class="acad-row ${banishMaxed ? 'maxed' : ''}" data-kind="banish" data-id="banish">
      <div class="ar-name">Banish Charge<span class="ar-rank">${banishBought}/${BANISH_MAX_BOUGHT}</span></div>
      <div class="ar-desc">+1 Banish charge per run (1 free + bought). Banish removes an offered card from the pool for the run.</div>
      <div class="ar-cost">${banishMaxed ? 'maxed' : BANISH_COST + ' seals'}</div>
    </div>`;
  const globalWithBanish = global + banishRow;

  // FIX Batch 7: Ultimates (200 Seals each, design §6) live in the Arsenal tab below T2/T3 rows. Cataclysm is free.
  const ultimates = ULTIMATES.map((u) => {
    const owned = !!(save.ultimates && save.ultimates[u.id]);
    return `<div class="acad-row ${owned ? 'owned' : ''}" data-kind="ultimate" data-id="${u.id}">
      <div class="ar-name">${u.name}<span class="ar-rank">Ultimate</span></div>
      <div class="ar-desc">${u.desc}</div>
      <div class="ar-cost">${owned ? 'unlocked' : ULTIMATE_COST + ' seals'}</div>
    </div>`;
  }).join('');
  const arsenal = Object.values(ABILITIES).filter((a) => a.tier >= 2).map((a) => {
    const owned = !!save.arsenal[a.id];
    const cost = ARSENAL_COST[a.tier];
    const col = ELEMENTS[a.element].color;
    return `<div class="acad-row ${owned ? 'owned' : ''}" data-kind="arsenal" data-id="${a.id}" data-tier="${a.tier}">
      <div class="ar-name"><span class="dot" style="background:${col}"></span>${a.name}<span class="ar-rank">T${a.tier}</span></div>
      <div class="ar-desc">${a.desc}</div>
      <div class="ar-cost">${owned ? 'unlocked' : cost + ' seals'}</div>
    </div>`;
  }).join('');

  const clans = Object.values(CLANS).map((c) => {
    const unlocked = clanUnlocked(save, c.id);
    const selected = save.clan === c.id;
    const rank = save.clanTree[c.id] || 0;
    const maxed = rank >= CLAN_TREE.ranks;
    const cost = clanTreeCost(save, c.id);
    const legacy = save.legacy[c.id];
    // FIX Batch 2 (clan click was confusing): one row did two jobs. Now the label says which job a click does.
    const clanAction = !unlocked ? 'Locked' : selected ? 'Click to train' : 'Click to select';
    const clanCost = !unlocked ? 'locked' : maxed ? (legacy ? 'legacy earned' : 'tree maxed') : selected ? `Train: tree ${rank}/${CLAN_TREE.ranks} · ${cost} seals` : `Select first — then train: tree ${rank}/${CLAN_TREE.ranks} · ${cost} seals`;
    return `<div class="acad-row clan ${unlocked ? '' : 'locked'} ${selected ? 'selected' : ''}"
        data-kind="clan" data-id="${c.id}">
      <div class="ar-name">${c.name}<span class="ar-rank">${unlocked ? clanAction : c.unlockMinutes + ' min'}</span></div>
      <div class="ar-desc">${c.short} · ${c.trait}</div>
      <div class="ar-cost">${clanCost}</div>
    </div>`;
  }).join('');

  return `<div class="panel acad">
    ${sealLine}
    <div class="acad-tabs">
      <div class="tab active" data-tab="global">Training</div>
      <div class="tab" data-tab="arsenal">Arsenal</div>
      <div class="tab" data-tab="clans">Clans</div>
    </div>
    <div class="acad-body" data-panel="global">${globalWithBanish}</div>
    <div class="acad-body hidden" data-panel="arsenal">${arsenal}${ultimates}</div>
    <div class="acad-body hidden" data-panel="clans">${clans}</div>
    <div class="acad-foot">
      <div id="acadmsg" style="min-height:18px;font-size:12.5px;color:#ffb0b0;text-align:center;"></div>
      ${perfectShinobi(save) ? '<span class="perfect">Perfect Shinobi · +10% damage on every run</span>' : ''}
      <div class="btn" id="acadclose">Back</div>
    </div>
  </div>`;
}
function bindAcademy(root, save, onBuy, onClose) {
  root.querySelectorAll('.tab').forEach((t) => {
    t.onclick = () => {
      root.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
      root.querySelectorAll('.acad-body').forEach((b) => {
        b.classList.toggle('hidden', b.dataset.panel !== t.dataset.tab);
      });
    };
  });
  root.querySelectorAll('.acad-row').forEach((row) => {
    row.onclick = () => {
      const kind = row.dataset.kind;
      const id = row.dataset.id;
      let res;
      if (kind === 'global') res = buyGlobal(save, id);
      else if (kind === 'banish') res = buyBanish(save);
      else if (kind === 'arsenal') res = buyArsenal(save, id, parseInt(row.dataset.tier, 10));
      else if (kind === 'ultimate') res = buyUltimate(save, id);
      else if (kind === 'clan') {
        if (clanUnlocked(save, id)) {
          if (save.clan !== id) { res = selectClan(save, id); }
          else res = buyClanTree(save, id);
        } else res = { ok: false, reason: 'locked' };
      }
      // FIX Batch 2 (Academy silent failures): a failed buy now says WHY instead of doing nothing.
      const msg = root.querySelector('#acadmsg');
      if (res && res.ok) { if (msg) msg.textContent = 'Purchased!'; onBuy(); }
      else if (msg && res) {
        if (res.reason === 'seals') msg.textContent = `Not enough Seals — need ${res.cost} seals.`;
        else if (res.reason === 'maxed') msg.textContent = 'Already maxed.';
        else if (res.reason === 'locked') msg.textContent = 'Locked — survive longer to unlock.';
        else if (res.reason === 'owned') msg.textContent = 'Already unlocked.';
        else msg.textContent = 'Cannot buy that right now.';
      }
    };
  });
  const close = root.querySelector('#acadclose');
  if (close) close.onclick = onClose;
}

// DOM HUD + overlay screens (start, level-up, run-end). No game logic here.




const $ = (id) => document.getElementById(id);
class UI {
  constructor() {
    this.overlay = $('overlay');
    this.hpfill = $('hpfill'); this.hptext = $('hptext');
    this.chakrafill = $('chakrafill'); this.chakratext = $('chakratext');
    this.xpfill = $('xpfill'); this.xptext = $('xptext');
    this.timer = $('timer'); this.banner = $('wavebanner');
    this.bar = $('abilitybar');
    this.slots = new Map();
    this.bannerT = 0;
    this.bossbar = document.getElementById('bossbar');
    this.bossfill = document.getElementById('bossfill');
  }

  hideOverlay() {
    this.overlay.classList.add('hidden');
    this.overlay.innerHTML = '';
    document.getElementById('hud').style.opacity = '1';
  }
  showOverlay(html) {
    this.overlay.innerHTML = html;
    this.overlay.classList.remove('hidden');
    document.getElementById('hud').style.opacity = '0';

  showAcademy(save, onBuy, onClose) {
    this.showOverlay(academyHTML(save));
    bindAcademy(this.overlay, save, onBuy, onClose);
  }

  showStart(onStart, save, onAcademy) {
    const ults = Object.values(ULTIMATES).map((u, i) => `
      <div class="ultcard" data-id="${u.id}">

        <div class="n">${u.name}</div>
        <div class="d">${u.desc}</div>
      </div>`).join('');
    this.showOverlay(`
      <div class="panel center">
        <div class="title">Shinobi Survival</div>
        <div class="sub">Step 4 · Twenty minutes · four bosses · a reason to run again</div>
        <div class="card stat" style="max-width:560px;margin:0 auto;cursor:default;">
          <div class="k">Your first mission</div>
          <div class="d" style="font-size:13.5px;">
            Twenty minutes. Four bosses between you and the rank of Kage — the Ronin at five,
            the Twin at ten, the Warden at fifteen, the Sovereign at twenty.<br><br>
            You start with a fireball and an empty loadout. Every level you pick a jutsu or a
            passive: four active slots, six passives, five ranks each. The elements prime each
            other — <b>Wind</b> aerates and Fire detonates for 3×, <b>Water</b> drenches and
            Lightning chains, <b>Earth</b> roots and Wind launches. Ten fusion pairs sit between
            the five elements. Seals carry over: spend them in the Academy.
          </div>
        </div>
        <div class="keys">
          <span><kbd>WASD</kbd> / <kbd>arrows</kbd> move</span>
          <span><kbd>Space</kbd> dash</span>
          <span><kbd>Q</kbd> or <kbd>click</kbd> ultimate</span>
          <span><kbd>A</kbd> auto-cast is automatic</span>
        </div>
        <div class="ultpick">
          <div class="sub" style="margin-bottom:10px">Choose your ultimate</div>
          <div class="ultlist">${ults}</div>
        </div>
        <div class="metastrip">
          <span>${save ? save.seals : 0} seals</span>
          <span>${save ? (CLANS[save.clan] || CLANS.ember).name : 'Ember'}</span>
          <span>Ascension ${save ? save.ascension : 0}</span>
          <div class="btn ghost" id="acadbtn">Academy</div>
        </div>
        <div class="btn" id="startbtn">Enter the forest</div>
        <div class="hint">Best on a keyboard. Touch works: left stick, right buttons.</div>
      </div>`);
    let chosen = 'cataclysm';
    this.overlay.querySelectorAll('.ultcard').forEach((el) => {
      if (el.dataset.id === chosen) el.classList.add('sel');
      el.onclick = () => {
        chosen = el.dataset.id;
        this.overlay.querySelectorAll('.ultcard').forEach((o) => o.classList.toggle('sel', o === el));
      };
    });
    $('startbtn').onclick = () => { this.hideOverlay(); onStart(chosen); };
    const ab = $('acadbtn');
    if (ab && onAcademy) ab.onclick = onAcademy;
  }

  // FIX Batch 5: showLevelUp now takes an optional rank (4th arg) and renders Breakthrough cards distinctly.
  // FIX Batch 6: 4th arg can also be an opts object { rank, banishCharges, onBanish }. Old string rank still works.
  // Banish buttons appear on ability/passive cards when banishCharges > 0. Banish costs a charge, NOT the pick.
  showLevelUp(level, choices, onPick, rankOrOpts) {
    const opts = typeof rankOrOpts === 'object' && rankOrOpts !== null ? rankOrOpts : { rank: rankOrOpts };
    const rank = opts.rank;
    const banishCharges = opts.banishCharges || 0;
    const onBanish = opts.onBanish || null;
    const rankLabel = rank ? ` · ${rank.charAt(0).toUpperCase() + rank.slice(1)}` : '';
    const banishLabel = banishCharges > 0 ? ` · ${banishCharges} Banish` : '';
    const cards = choices.map((c, i) => {
      if (c.kind === 'breakthrough') {
        return `<div class="card breakthrough" data-i="${i}" style="border-color:#ffd27a;background:linear-gradient(180deg,rgba(255,210,122,0.16),rgba(255,122,47,0.08))">
        <div class="k">Breakthrough · ${c.tag}</div>
        <div class="n">${c.name}</div>
        <div class="d">${c.desc}</div>
        <div class="tag">RANK</div>
      </div>`;
      }
      const cls = c.element === 'stat' ? 'stat' : c.element;
      const canBanish = (c.kind === 'ability' || c.kind === 'passive') && banishCharges > 0 && onBanish;
      const kindLabel = c.kind.startsWith('postcap') ? 'Post-cap' : c.kind === 'ability' ? 'Jutsu' : 'Passive';
      return `<div class="card ${cls}" data-i="${i}">
        <div class="k">${kindLabel} · ${c.tag}</div>
        <div class="n">${c.name}</div>
        <div class="d">${c.desc}</div>
        <div class="tag">${c.element === 'stat' ? 'Passive' : c.element.toUpperCase()}</div>
        ${canBanish ? `<div class="banish-btn" data-banish="${i}" style="margin-top:8px;font-size:11px;opacity:0.8;cursor:pointer;text-decoration:underline;">Banish — remove from this run</div>` : ''}
      </div>`;
    }).join('');
    this.showOverlay(`
      <div class="panel">
        <div class="title" style="font-size:clamp(22px,4vw,36px)">Level ${level}${rankLabel}${banishLabel}</div>
        <div class="sub">Choose one</div>
        <div class="cards">${cards}</div>
        <div class="hint">1 · 2 · 3 to pick</div>
      </div>`);
    const pick = (i) => { this.hideOverlay(); onPick(choices[i]); };
    this.overlay.querySelectorAll('.card').forEach((el) => {
      el.onclick = () => pick(parseInt(el.dataset.i, 10));
    });
    // FIX Batch 6: Banish buttons stop propagation — banishing does NOT pick the card.
    this.overlay.querySelectorAll('[data-banish]').forEach((btn) => {
      btn.onclick = (e) => { e.stopPropagation(); if (onBanish) onBanish(choices[parseInt(btn.dataset.banish, 10)]); };
    });
    this.currentPick = pick;
  }

  showChoice({ onFight, onExtract }) {
    this.showOverlay(`
      <div class="panel center">
        <div class="title" style="font-size:clamp(24px,4.4vw,40px)">The Sovereign is broken</div>
        <div class="sub">Extract, or finish it</div>
        <div class="card stat" style="max-width:560px;margin:0 auto;cursor:default;text-align:left;">
          <div class="d" style="font-size:13.5px;">
            He is at a quarter health and the arena is about to collapse. Walking away now keeps
            everything you earned. Staying means the fight gets harder — and losing it costs you
            a quarter of your Seals.
          </div>
        </div>
        <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:22px;">
          <div class="btn ghost" id="extractbtn">Extract</div>
          <div class="btn" id="fightbtn">Finish the fight</div>
        </div>
      </div>`);
    document.getElementById('extractbtn').onclick = () => { this.hideOverlay(); onExtract(); };
    document.getElementById('fightbtn').onclick = () => { this.hideOverlay(); onFight(); };
  }

  showRunEnd({ win, time, level, kills, damage, abilities, passives, bossPct, stage, extracted, sealsEarned, sealsTotal }, onRestart) {
    const mm = Math.floor(time / 60), ss = Math.floor(time % 60).toString().padStart(2, '0');
    const build = abilities.map((a) => `${ABILITIES[a.id].name} <span style="opacity:.55">R${a.rank}</span>`).join(' · ');
    const pas = passives.length
      ? passives.map((a) => `${PASSIVES[a.id].name} <span style="opacity:.55">R${a.rank}</span>`).join(' · ')
      : 'none';
    this.showOverlay(`
      <div class="panel center">
        <div class="title" style="font-size:clamp(26px,5vw,46px);${win ? '' : 'background:linear-gradient(180deg,#fff,#ff5a5a);-webkit-background-clip:text;background-clip:text;'}">
          ${win ? (extracted ? 'Extracted — Alive' : 'The Sovereign falls') : 'You fell'}
        </div>
        <div class="sub">${extracted ? 'Extracted with what you earned' : win ? 'Run complete' : 'The forest keeps what it takes'}</div>
        <div class="stats">
          <div class="stat-box"><div class="v">${mm}:${ss}</div><div class="l">Survived</div></div>
          <div class="stat-box"><div class="v">${level}</div><div class="l">Level</div></div>
          <div class="stat-box"><div class="v">${stage}/4</div><div class="l">Bosses</div></div>
          <div class="stat-box"><div class="v">${kills}</div><div class="l">Kills</div></div>
          <div class="stat-box"><div class="v">${Math.round(damage / 100) / 10}k</div><div class="l">Damage</div></div>
          <div class="stat-box"><div class="v" style="color:#ffd27a">+${sealsEarned || 0}</div><div class="l">Seals · ${sealsTotal || 0} owned</div></div>
          ${win ? '' : `<div class="stat-box"><div class="v">${bossPct}%</div><div class="l">${['The Ronin', 'The Twin', 'The Warden', 'The Sovereign'][stage] || 'Boss'} HP left</div></div>`}
          <!-- FIX Batch 2: run-end no longer always says "Ronin". Title is Sovereign / Extracted on win, boss name on loss follows the stage you died in. -->
        </div>
        <div class="card stat" style="max-width:640px;margin:18px auto 0;cursor:default;text-align:left;">
          <div class="k">Your build</div>
          <div class="d">${build || 'nothing'}</div>
          <div class="k" style="margin-top:12px">Passives</div>
          <div class="d">${pas}</div>
        </div>
        <div class="btn" id="againbtn">Run again</div>
        <div class="hint">${win ? 'Try a different build: Fire alone, or Fire + Wind for Firestorm.' : 'Tip: dash through gaps, not into them. Aerated + Fire is your damage spike.'}</div>
      </div>`);
    $('againbtn').onclick = () => { this.hideOverlay(); onRestart(); };
  }

  banner_(text, seconds = 2.4) {
    this.banner.textContent = text;
    this.banner.style.opacity = '1';
    this.bannerT = seconds;
  }

  update(world, dt) {
    const p = world.player;
    const hpPct = Math.max(0, p.hp / p.maxHp) * 100;
    this.hpfill.style.width = hpPct + '%';
    this.hptext.textContent = `${Math.ceil(p.hp)} / ${p.maxHp}`;
    const ch = p.chakra;
    this.chakrafill.style.width = ch + '%';
    this.chakrafill.classList.toggle('full', ch >= 100);
    this.chakratext.textContent = ch >= 100 ? 'OVERCHARGE READY' : `${Math.floor(ch)} / 100`;
    this.xpfill.style.width = Math.min(100, (p.xp / p.xpNeed) * 100) + '%';
    this.xptext.textContent = `Lv ${p.level} · ${Math.floor(p.xp)}/${p.xpNeed}`;
    const t = Math.min(world.t, 1200);
    const mm = Math.floor(t / 60), ss = Math.floor(t % 60).toString().padStart(2, '0');
    this.timer.textContent = `${mm}:${ss}`;

    const bosses = world.bosses.filter((b) => b.alive);
    if (bosses.length) {
      this.bossbar.classList.remove('hidden');
      let hp = 0, max = 0;
      for (const b of bosses) { hp += Math.max(0, b.hp); max += b.maxHp; }
      this.bossfill.style.width = Math.max(0, (hp / max) * 100) + '%';
      const label = bosses.length > 1 ? bosses.map((b) => b.name.split('· ')[1] || b.name).join(' + ') : bosses[0].name;
      this.bossbar.querySelector('.bname').textContent = label;
    } else {
      this.bossbar.classList.add('hidden');
    }
    if (this.bannerT > 0) {
      this.bannerT -= dt;
      if (this.bannerT <= 0) this.banner.style.opacity = '0';
    }
    this.updateBar(world);
  }

  updateBar(world) {
    // 4 active slots + the ultimate
    const list = world.abilities;
    if (!this.bar.children.length) {
      for (let i = 0; i < 5; i++) {
        const d = document.createElement('div');
        d.className = 'ab';
        d.innerHTML = `<span class="nm"></span><span class="rk"></span><div class="cd"></div><div class="bar"></div>`;
        this.bar.appendChild(d);
      }
    }
    for (let i = 0; i < 5; i++) {
      const el = this.bar.children[i];
      if (i === 4) {
        const ready = world.player.chakra >= 100;
        el.classList.toggle('on', ready);
        el.querySelector('.nm').textContent = 'ULT';
        el.querySelector('.rk').textContent = '';
        el.querySelector('.cd').style.height = '0%';
        el.querySelector('.bar').style.background = ready ? '#b9a6ff' : '#4b3a7a';
        continue;
      }
      const ab = list[i];
      if (!ab) {
        el.classList.remove('on');
        el.querySelector('.nm').textContent = '';
        el.querySelector('.rk').textContent = '';
        el.querySelector('.cd').style.height = '100%';
        el.querySelector('.bar').style.background = 'transparent';
        continue;
      }
      const def = ABILITIES[ab.id];
      el.classList.add('on');
      el.querySelector('.nm').textContent = def.name.split(' ').slice(0, 2).join(' ');
      el.querySelector('.rk').textContent = 'R' + ab.rank;
      const cdPct = Math.max(0, Math.min(1, ab.cd / ab.cdMax));
      el.querySelector('.cd').style.height = (cdPct * 100) + '%';
      const col = ELEMENTS[def.element] ? ELEMENTS[def.element].color : '#8a8f9c';
      el.querySelector('.bar').style.background = col;
    }
  }
}

// Tiny WebAudio synth — no assets. Everything is generated.
class Audio {
  constructor() { this.ctx = null; this.enabled = true; this.master = null; this.noise = null; }
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.35;
    this.master.connect(this.ctx.destination);
    // shared noise buffer
    const len = this.ctx.sampleRate * 0.5;
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    this.noise = buf;
  }
  toggle() {
    this.enabled = !this.enabled;
    if (this.master) this.master.gain.value = this.enabled ? 0.35 : 0;
    return this.enabled;
  }
  tone(freq, dur, type = 'sine', gain = 0.2, slide = 0) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  noiseHit(dur = 0.12, gain = 0.25, freq = 900, q = 1) {
    if (!this.ctx || !this.enabled) return;
    const t = this.ctx.currentTime;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noise;
    const f = this.ctx.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur);
  }
  cast(el) {
    switch (el) {
      case 'wind': this.noiseHit(0.12, 0.13, 2400, 2.4); break;
      case 'water': this.tone(420, 0.14, 'sine', 0.10, -180); this.noiseHit(0.08, 0.08, 900, 1.4); break;
      case 'lightning': this.noiseHit(0.07, 0.16, 3800, 3.0); this.tone(900, 0.06, 'square', 0.07, -300); break;
      case 'earth': this.tone(90, 0.18, 'sine', 0.16, 30); this.noiseHit(0.10, 0.14, 260, 0.8); break;
      default: this.tone(220, 0.12, 'sawtooth', 0.10, 120);
    }
  }
  telegraph(kind) {
    if (kind === 'dash') this.tone(180, 0.18, 'triangle', 0.09, 90);
    else this.tone(140, 0.22, 'sine', 0.10, 40);
  }
  fusion() {
    this.noiseHit(0.34, 0.34, 200, 0.7);
    this.tone(70, 0.32, 'sine', 0.26, -20);
  }
  bossPhase() {
    this.tone(110, 0.5, 'sawtooth', 0.14, 60);
    this.noiseHit(0.5, 0.18, 140, 0.6);
  }
  extract() {
    this.tone(300, 0.2, 'triangle', 0.14, 180);
    setTimeout(() => this.tone(450, 0.28, 'triangle', 0.12, 220), 140);
  }
  hit(big) {
    this.noiseHit(big ? 0.16 : 0.07, big ? 0.28 : 0.12, big ? 320 : 700, big ? 0.9 : 1.6);
  }
  detonate() {
    this.noiseHit(0.3, 0.32, 220, 0.7);
    this.tone(90, 0.28, 'sine', 0.22, -40);
  }
  hurt() { this.tone(140, 0.18, 'square', 0.16, -60); }
  level() { this.tone(520, 0.1, 'triangle', 0.16, 180); setTimeout(() => this.tone(720, 0.14, 'triangle', 0.14, 200), 90); }
  ultimate() { this.noiseHit(0.6, 0.35, 160, 0.6); this.tone(60, 0.6, 'sine', 0.28, -20); }
  boss() { this.tone(70, 0.9, 'sine', 0.3, 20); this.noiseHit(0.7, 0.25, 120, 0.5); }
  // FIX Batch 4 (Batch 2 events had VFX but no sound): Warden armor, Twin swap, enrage, Ronin counter.
  armor() { this.tone(1200, 0.08, 'square', 0.08, -400); this.noiseHit(0.06, 0.10, 2800, 2.0); }
  swap() { this.noiseHit(0.18, 0.16, 1800, 1.8); this.tone(600, 0.16, 'sine', 0.10, 300); }
  enrage() { this.tone(65, 0.6, 'sawtooth', 0.22, 40); this.noiseHit(0.5, 0.20, 130, 0.6); }
  counter() { this.tone(900, 0.10, 'square', 0.12, -500); this.noiseHit(0.10, 0.14, 2200, 1.6); }
  // FIX Batch 5: Breakthrough fanfare + Flow State shimmer.
  breakthrough() { this.tone(520, 0.14, 'triangle', 0.16, 180); setTimeout(() => this.tone(780, 0.22, 'triangle', 0.14, 220), 120); }
  flow() { this.noiseHit(0.30, 0.14, 3200, 2.0); this.tone(880, 0.30, 'sine', 0.10, 400); }
  // FIX Batch 6: Banish whoosh.
  banish() { this.noiseHit(0.22, 0.16, 1600, 1.6); this.tone(320, 0.18, 'sine', 0.08, -140); }
}

// Dev autopilot (only when ?auto=1): kites crowds, sweeps gems, dodges boss telegraphs.
// The same behaviour the headless tests use, so a browser run can be checked hands-free.
function botStep(w, time) {
  const p = w.player;
  const N = 16;
  const list = w.enemies.active;
  let bestA = 0, bestScore = -Infinity;

  for (let k = 0; k < N; k++) {
    const a = (k / N) * Math.PI * 2;
    const dx = Math.cos(a), dy = Math.sin(a);
    const px = p.x + dx * 110, py = p.y + dy * 110;
    let threat = 0;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      if (!e.alive) continue;
      const ex = e.x - px, ey = e.y - py;
      const d2 = ex * ex + ey * ey;
      if (d2 < 200 * 200) threat += 1 - d2 / (200 * 200);
    }
    // reward moving toward loose gems
    let gemPull = 0;
    const gems = w.gems.active;
    for (let i = 0; i < gems.length; i++) {
      const g = gems[i];
      const gx = g.x - p.x, gy = g.y - p.y;
      const d = Math.hypot(gx, gy) || 1;
      if (d < 340) gemPull += ((gx / d) * dx + (gy / d) * dy) * (1 - d / 340);
    }
    let score = -threat * 2.2 + gemPull * 1.1;
    // step out of telegraphed circles before they land
    for (let zi = 0; zi < w.zones.active.length; zi++) {
      const z = w.zones.active[zi];
      if (z.t > 0.75) continue;
      const zx = px - z.x, zy = py - z.y;
      const zd = Math.hypot(zx, zy);
      if (zd < z.r) score -= (1 - zd / z.r) * 5;
    }
    if (w.boss && w.boss.alive) {
      const bx = w.boss.x - p.x, by = w.boss.y - p.y;
      const d = Math.hypot(bx, by) || 1;
      // hold a mid range from the boss, not melee, not running away
      const want = d > 300 ? 1 : d < 180 ? -1 : 0;
      score += ((bx / d) * dx + (by / d) * dy) * want * 1.4;
    }
    if (w.boss && w.boss.alive) {
      const b = w.boss;
      const bx = p.x - b.x, by = p.y - b.y, bd = Math.hypot(bx, by) || 1;
      if (b.state === 'telegraph' || b.state === 'dash') {
        // sidestep: prefer directions perpendicular to the incoming line
        const px2 = -by / bd, py2 = bx / bd;
        score += Math.abs((px2 * dx + py2 * dy)) * 2.2 - ((bx / bd) * dx + (by / bd) * dy) * 3.0;
      }
    }
    if (score > bestScore) { bestScore = score; bestA = a; }
  }

  w.input.x = Math.cos(bestA);
  w.input.y = Math.sin(bestA);

  let close = 0;
  for (let i = 0; i < list.length; i++) {
    const e = list[i];
    if (e.alive && (e.x - p.x) ** 2 + (e.y - p.y) ** 2 < 80 * 80) close++;
  }
  let bossThreat = false;
  if (w.boss && w.boss.alive) {
    const b = w.boss;
    const bd = Math.hypot(b.x - p.x, b.y - p.y);
    if ((b.state === 'telegraph' || b.state === 'dash') && bd < 320) bossThreat = true;
  }
  w.input.dash = (close > 4 || bossThreat) && p.dashCd <= 0;
  w.input.ult = p.chakra >= 100;
}


/* ---- src/app.js ---- */
// App shell: input, fixed-timestep loop, screen transitions.






const canvas = document.getElementById('game');
window.__err = '';
window.addEventListener('error', (e) => { window.__err = String(e.message || e.error); });
window.addEventListener('unhandledrejection', (e) => { window.__err = 'rej ' + String(e.reason); });
const params = new URLSearchParams(location.search);
const seed = params.has('seed') ? parseInt(params.get('seed'), 10) : (Date.now() % 100000);

const world = new World(seed);
let save = loadSave(window.localStorage);
// dev helper: ?debugseals=500 seeds a balance for testing the Academy
if (params.has('debugseals')) { save.seals = parseInt(params.get('debugseals'), 10) || 0; }
if (params.has('debugasc')) { save.ascension = parseInt(params.get('debugasc'), 10) || 0; }
const renderer = new Renderer(canvas, world);
const ui = new UI();
const audio = new Audio();

let started = false;
let menuOpen = false;
let acc = 0;
let last = performance.now();
let bossAnnounced = false;
let lateAnnounced = false;
let safeAnnounced = false;
let fpsAcc = 0, fpsN = 0;

window.addEventListener('resize', () => renderer.resize());

// ---------------- input ----------------
const keys = new Set();
const KEYMAP = {
  KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
  KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
};
window.addEventListener('keydown', (e) => {
  if (KEYMAP[e.code]) { keys.add(KEYMAP[e.code]); e.preventDefault(); }
  if (e.code === 'Space') { world.input.dash = true; e.preventDefault(); }
  if (e.code === 'KeyQ') { tryUltimate(); }
  if (e.code === 'KeyM') audio.toggle();
  if (e.code === 'Digit1' && ui.currentPick) ui.currentPick(0);
  if (e.code === 'Digit2' && ui.currentPick) ui.currentPick(1);
  if (e.code === 'Digit3' && ui.currentPick) ui.currentPick(2);
  audio.init();
});
window.addEventListener('keyup', (e) => {
  if (KEYMAP[e.code]) keys.delete(KEYMAP[e.code]);
});

function readKeys() {
  let x = 0, y = 0;
  if (keys.has('left')) x -= 1;
  if (keys.has('right')) x += 1;
  if (keys.has('up')) y -= 1;
  if (keys.has('down')) y += 1;
  return { x, y };
}

// touch joystick
let stickId = null, stickOrigin = null;
const stick = document.getElementById('stick');
const knob = document.getElementById('stickknob');
const isTouch = window.matchMedia('(pointer: coarse)').matches;
if (isTouch) {
  document.getElementById('touch').classList.remove('hidden');
  const dashBtn = document.getElementById('dashbtn');
  const ultBtn = document.getElementById('ultbtn');
  dashBtn.addEventListener('touchstart', (e) => { world.input.dash = true; e.preventDefault(); });
  ultBtn.addEventListener('touchstart', (e) => { tryUltimate(); e.preventDefault(); });
}
stick.addEventListener('touchstart', (e) => {
  const t = e.changedTouches[0];
  stickId = t.identifier;
  const r = stick.getBoundingClientRect();
  stickOrigin = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  e.preventDefault();
}, { passive: false });
stick.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    const dx = t.clientX - stickOrigin.x, dy = t.clientY - stickOrigin.y;
    const max = 46;
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, d / max);
    touchVec.x = (dx / d) * k; touchVec.y = (dy / d) * k;
    knob.style.transform = `translate(${(dx / d) * Math.min(max, d)}px, ${(dy / d) * Math.min(max, d)}px)`;
  }
  e.preventDefault();
}, { passive: false });
const resetStick = (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== stickId) continue;
    stickId = null; touchVec.x = 0; touchVec.y = 0;
    knob.style.transform = 'translate(0,0)';
  }
};
stick.addEventListener('touchend', resetStick);
stick.addEventListener('touchcancel', resetStick);
const touchVec = { x: 0, y: 0 };

canvas.addEventListener('dblclick', () => tryUltimate());
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function tryUltimate() {
  if (world.state !== 'playing') return;
  if (world.castUltimate()) audio.ultimate();
}

// ---------------- audio hooks ----------------
world.bus.on('cast', (e) => audio.cast(e.element || 'fire'));
world.bus.on('damage', (e) => { if (!e.dot) audio.hit(e.crit || e.detonate); });
world.bus.on('detonate', () => audio.detonate());
world.bus.on('fusion', () => audio.fusion());
world.bus.on('boss:telegraph', (e) => audio.telegraph(e.kind));
world.bus.on('boss:phase', () => audio.bossPhase());
world.bus.on('stage:clear', () => audio.level());
world.bus.on('player:hurt', () => audio.hurt());
world.bus.on('levelup', () => audio.level());
world.bus.on('boss:spawn', () => audio.boss());
// FIX Batch 4: Batch 2 boss events had VFX but no sound. Hook them up.
world.bus.on('boss:armor', () => audio.armor());
world.bus.on('boss:swap', () => audio.swap());
world.bus.on('boss:enrage', () => audio.enrage());
world.bus.on('counter:reflect', () => audio.counter());
// FIX Batch 5: Breakthrough + Flow audio.
world.bus.on('rank:breakthrough', () => audio.breakthrough());
world.bus.on('flow:start', () => audio.flow());
// FIX Batch 6: Banish audio.
world.bus.on('banish', () => audio.banish());

// ---------------- screens ----------------
// dev helpers: ?warp=<seconds> skips ahead, &god=1 keeps the player alive while skipping
const WARP = parseInt(params.get('warp') || '0', 10);
const GOD = params.get('god') === '1';
const SHOW_FPS = params.get('fps') === '1';
const AUTO = params.get('auto') === '1';
const NO_MENUS = params.get('nomenu') === '1';

function startRun(ult = params.get('ult') || 'cataclysm') {
  world.reset(params.has('seed') ? seed : (Date.now() % 100000), save);
  world.ultimate = ult;
  const realDamage = world.damagePlayer.bind(world);
  if (GOD) world.damagePlayer = () => {};
  if (WARP > 0) {
    const ticks = WARP * 60;
    for (let i = 0; i < ticks; i++) {
      try {
      if (world.state === 'levelup') {
        if (AUTO) { world.chooseLevelUp(world.pendingChoices[0]); continue; }
        break;
      }
      if (world.state !== 'playing') break;
      if (AUTO) botStep(world, world.t);
      world.step(TICK);
      } catch (err) {
        window.__err = 'warp: ' + err.message + ' @t' + world.t.toFixed(0);
        break;
      }
    }
    bossAnnounced = world.bossSpawned;
    lateAnnounced = world.t > 285;
  }
  if (GOD) world.damagePlayer = realDamage;
  if (params.has('hp1')) { world.player.hp = 1; world.player.iframe = 0; world.player.regenT = 0; }
  acc = 0; started = true; menuOpen = false;
  bossAnnounced = false; lateAnnounced = false;
  audio.init();
  ui.banner_('Whispering Forest', 2.2);
}

function openAcademy() {
  ui.showAcademy(save, () => {
    writeSave(window.localStorage, save);
    ui.showAcademy(save, refreshAcademy, () => { ui.hideOverlay(); ui.showStart(startRun, save, openAcademy); });
  }, () => { ui.hideOverlay(); ui.showStart(startRun, save, openAcademy); });
}
function refreshAcademy() {
  ui.showAcademy(save, refreshAcademy, () => { ui.hideOverlay(); ui.showStart(startRun, save, openAcademy); });
}
if (AUTO) { startRun(); } else { ui.showStart(startRun, save, openAcademy); }

function handleState() {
  if (world.state === 'levelup' && AUTO) {
    world.chooseLevelUp(world.pendingChoices[0]);
    return;
  }
  if (world.state === 'levelup' && !menuOpen) {
    menuOpen = true;
    // FIX Batch 6: Banish does NOT cost the pick — after banishing, re-show the re-rolled menu with the same pick handler.
    const showMenu = () => ui.showLevelUp(world.player.level, world.pendingChoices, pick, {
      rank: world.player.rank, banishCharges: world.player.banishCharges,
      onBanish: (choice) => { if (world.banish(choice)) showMenu(); },
    });
    const pick = (choice) => {
      world.chooseLevelUp(choice);
      if (world.state === 'levelup') showMenu();
      else menuOpen = false;
    };
    showMenu();
    return;
  }
  if (world.state === 'choice' && AUTO) { world.resumeFight(); return; }
  if (world.state === 'choice' && !menuOpen) {
    menuOpen = true;
    ui.showChoice({
      onFight: () => { menuOpen = false; world.resumeFight(); },
      onExtract: () => { menuOpen = false; world.extract(); },
    });
    return;
  }
  if ((world.state === 'dead' || world.state === 'won') && !menuOpen) {
    menuOpen = true;
    const earned = bankRun(save, {
      win: world.state === 'won' && !world.extracted,
      extracted: world.extracted,
      bosses: world.stageIndex,
      time: world.t,
      level: world.player.level,
    });
    writeSave(window.localStorage, save);
    ui.showRunEnd({
      win: world.state === 'won', time: world.t, level: world.player.level, kills: world.kills,
      damage: world.damageDealt,
      abilities: world.abilities.map((a) => ({ ...a })),
      passives: world.passives.map((a) => ({ ...a })),
      bossPct: world.boss ? Math.max(0, Math.round((world.boss.hp / world.boss.maxHp) * 100)) : 100,
      stage: world.stageIndex, extracted: world.extracted,
      sealsEarned: earned, sealsTotal: save.seals,
    }, () => { menuOpen = false; startRun(world.ultimate); });
  }
}

// ---------------- loop ----------------
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;

  if (started && world.state === 'playing') {
    if (AUTO) {
      botStep(world, world.t);
    } else {
      const k = readKeys();
      if (touchVec.x || touchVec.y) { world.input.x = touchVec.x; world.input.y = touchVec.y; }
      else { world.input.x = k.x; world.input.y = k.y; }
    }
    if (world.hitstop > 0) {
      world.hitstop = Math.max(0, world.hitstop - dt);   // brief freeze on big hits
      acc = 0;
    } else {
      acc += dt;
      let guard = 0;
      while (acc >= TICK && guard++ < 6) {
        world.step(TICK);
        acc -= TICK;
        if (world.state !== 'playing') break;
      }
    }
    if (world.state === 'playing' && !lateAnnounced && world.t > 270 && world.t < 300) {
      lateAnnounced = true;
      ui.banner_('Something is coming', 2.0);
    }
    if (world.safeT > 0 && !safeAnnounced) {
      safeAnnounced = true;
      ui.banner_('The field goes quiet', 1.6);
    }
    if (world.safeT <= 0) safeAnnounced = false;
    if (world.bossActive && !bossAnnounced) {
      bossAnnounced = true;
      ui.banner_(world.boss ? world.boss.name : 'Boss', 2.6);
    }
    if (!world.bossActive) bossAnnounced = false;
  }

  renderer.draw(dt);
  ui.update(world, dt);
  if (SHOW_FPS) {
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) {
      const w = world;
      document.getElementById('fps').textContent =
        `${Math.round(fpsN / fpsAcc)} fps · ${w.enemies.count} en · ${w.t.toFixed(0)}s · ${w.state} · lv ${w.player.level} · kills ${w.kills} · boss ${w.boss ? Math.round(w.boss.hp) : '-'} · hp ${Math.round(w.player.hp)} · ${w.abilities.map(a=>a.id[0]+a.rank).join('')} · xp ${Math.round(w.player.xp)}/${w.player.xpNeed} · gems ${w.gems.count} · ERR ${window.__err || '-'}`;
      fpsAcc = 0; fpsN = 0;
    }
  }
  if (isTouch) {
    document.getElementById('ultbtn').classList.toggle('ready', world.player.chakra >= 100);
  }
  handleState();
  requestAnimationFrame(frame);
}
